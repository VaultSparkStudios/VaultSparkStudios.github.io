name: CI Health Monitor

# S223 — escalates the scheduled-workflow staleness beacon (check-scheduled-workflow-staleness.mjs)
# beyond the doctor table by opening/updating/closing a GitHub Issue (label: ci-health).
#
# Pattern: runs daily, writes staleness JSON, then sync-ci-health-issue.mjs manages the
# single idempotent ci-health issue. If all scheduled workflows are green: closes the issue.
# If any are dead for ≥2 consecutive runs: creates or updates the issue body in-place.
#
# Workflow itself is advisory — never blocks deploys. The issue escalation is the signal.

on:
  schedule:
    - cron: '0 9 * * *'   # 9am UTC daily (after nightly crons have had time to run)
  workflow_dispatch:        # manual trigger for testing

jobs:
  health-check:
    name: Scheduled workflow health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write    # needed for gh issue create/edit/close/comment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Run staleness probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/check-scheduled-workflow-staleness.mjs --json > staleness-result.json
          || true
      - name: Sync CI health issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/sync-ci-health-issue.mjs staleness-result.json

  surface-assurance:
    name: Daily live routes and Desk assurance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check every local HTML route
        run: node scripts/crawl-all-pages.mjs
      # S368: real Desk art is generated locally after publication; alert when any
      # story has carried placeholder art for more than 48 hours.
      - name: Check Desk art currency
        run: node scripts/check-desk-art-currency.mjs
      - name: Check every live sitemap route and newest Desk edition
        run: |
          node scripts/check-live-surface-matrix.mjs --self-test
          node scripts/check-live-surface-matrix.mjs
      - name: Check canonical edge liveness
        run: node scripts/smoke-live.mjs --edge-only
      - name: Install existing browser test dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Check key public journeys and Desk themes in Chromium
        env:
          BASE_URL: https://vaultsparkstudios-website.pages.dev
        run: npx playwright test tests/smoke.spec.js tests/news-theme-controls.spec.js --project=chromium --reporter=list --workers=2
      # S373: measure what production serves against the commit it reports, and name
      # the release lane that can carry each difference. Last in the job so it can never hide another check. Report-only on purpose: the
      # automated Desk lane promotes only newsroom paths, so other feeds lag between
      # content runs by design, and an enforcing step here would be red most days.
      - name: Report served-versus-committed byte parity
        run: |
          node scripts/check-served-parity.mjs --self-test
          SHA=$(curl -fsS https://vaultsparkstudios-website.pages.dev/api/build-sha.json | node -e "let s='';process.stdin.on('data',x=>s+=x).on('end',()=>{const j=JSON.parse(s);process.stdout.write(j.contentLaneHead||j.sha||'')})")
          git fetch --no-tags --depth=1 origin "$SHA" || echo "deployed commit $SHA not fetchable; the report will say unverified"
          node scripts/check-served-parity.mjs
