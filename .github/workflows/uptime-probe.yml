# uptime-probe.yml (S176 #6 · uptime-probe-firstparty)
#
# First-party availability monitoring — every 30 minutes, probe key routes
# with a browser UA and email the founder via Resend on any real failure.
# Free-build bias (CANON-017): replaces the MISSING uptimerobot credential
# with Actions cron + existing Resend capability.
#
# S178 — the probe now PUBLISHES, not just alerts. It writes api/uptime.json
# (live summary + 30-day rollup) and appends data/uptime-history.ndjson, and
# the commit step below pushes them so /status/ renders a real availability
# number. Low-churn by design: the probe only records (and sets .cache/
# uptime-commit=1) on a new hour bucket, a state change, or an incident — a
# healthy site inside the same hour produces no row and no commit.
name: uptime-probe

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # S316 — see cloudflare-analytics-pull.yml. This workflow also runs
          # build-deploy-currency, whose history lookup is meaningless in a
          # depth-1 clone.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore alert-dedup cache
        uses: actions/cache@v4
        with:
          path: .cache/uptime-alerts-sent.json
          key: uptime-alerts-${{ github.run_id }}
          restore-keys: uptime-alerts-
      - name: Restore colo-sample supplement
        uses: actions/cache@v4
        with:
          # S186: accumulate synthetic colo TTFB samples across runs so a thin
          # non-US sample set can confirm the origin-migration win globally,
          # without committing api/geo-vitals.json every 30 min (low-churn).
          path: .cache/probe-colo-supplement.ndjson
          key: colo-supplement-${{ github.run_id }}
          restore-keys: colo-supplement-
      - name: Probe routes
        id: probe
        continue-on-error: true   # a real outage exits non-zero; we still want to record + commit it
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node scripts/probe-uptime.mjs
      - name: Colo probe (global edge sample)
        continue-on-error: true   # a non-US sample failure must never fail the uptime job
        run: node scripts/probe-uptime.mjs --colo-probe
      - name: Refresh staging parity
        # S192: keep api/staging-health.json fresh so it never silently rots into
        # a false-stale signal that drags the public trustScore. --refresh writes
        # an honest 'staging-unreachable' status (and a fresh generatedAt) when the
        # Hetzner box is down, and always exits 0. Committed low-churn below,
        # piggybacked on the uptime commit cadence (well under the 84h seed-rot bound).
        continue-on-error: true
        run: node scripts/check-staging-parity.mjs --refresh
      - name: Publish uptime status
        if: always()
        # S319: the deploy-currency quorum needs TWO agreeing vantages. Only
        # provider-origin was observing — routed-apex returns 403 (Cloudflare
        # challenges the runner), github-deploy-step has no successful production
        # deploy to read, and cloudflare-pages-api reported capability-unavailable
        # purely because these secrets, which already exist on the repository,
        # were never passed to the step. Production currency therefore published
        # as "unverified", and the pre-deploy Doctor exemption — which requires
        # the honest "stale" reading — could never apply.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # S320: deploy-currency is OBSERVED on every run, before the low-churn
          # short-circuit — not after it. It used to sit further down this step, so a
          # healthy same-hour run skipped the probe entirely and the committed reading
          # aged silently while every surface kept rendering it as current. A freshness
          # ceiling can only fire on evidence that keeps being taken, and "nothing else
          # changed this hour" is precisely when a staleness clock needs reading.
          # Never hard-fails: an unavailable vantage must leave the reading unverified
          # rather than redden a cron that also publishes availability.
          mkdir -p .cache
          node scripts/build-deploy-currency.mjs --probe \
            || echo "deploy-currency probe unavailable this run — reading left as-is (unverified)"
          # A changed observation is itself commit-worthy, otherwise the probe would
          # run and then be discarded by the very short-circuit it must be able to lift.
          if ! git diff --quiet -- api/deploy-currency.json; then
            echo "deploy-currency observation changed — commit-worthy."
            echo 1 > .cache/uptime-commit
          fi
          if [ "$(cat .cache/uptime-commit 2>/dev/null)" != "1" ]; then
            echo "No commit-worthy change (healthy, same hour) — skipping."
            exit 0
          fi
          # Route-level production provenance: five bounded GET/OPTIONS probes,
          # no bodies, identifiers, cookies, or credentials retained.
          node scripts/build-worker-route-provenance.mjs --probe
          # S293: append-only semantic history for the probe above. Writes a row
          # ONLY when route meaning changes, so a healthy edge adds no churn — but
          # an incident finally gets a measurable duration instead of a snapshot
          # that reads identically on day 1 and day 23. The ledger is staged with
          # the feed below; committing one without the other is the strand class
          # `check-publish-cascade-coverage` now blocks via the graph's alsoStage.
          node scripts/build-worker-route-history.mjs
          # S293: api/public-status.json now carries an edgeIntegrity block fed by
          # the route history above, and status-proof embeds public-status — so
          # this publisher must resync it or the public status surface reports a
          # stale edge verdict until the next human closeout.
          node scripts/build-public-status.mjs
          # S293: deploy currency. Production served a build 134 commits / 2.3
          # days old while the startup brief reported "no gaps", because the file
          # that signal read had no producer at all. This IS that producer —
          # one bounded GET of the public build-sha feed, compared to repo
          # history at probe time. Without it running on a schedule the gap is
          # only ever noticed by a human who happens to look.
          # S320: the probe itself now runs at the TOP of this step (see above) so it
          # is taken even on runs with nothing else to commit. Deliberately not
          # repeated here — one bounded observation per run, not two.
          node scripts/build-geo-vitals.mjs
          node scripts/build-security-posture.mjs
          node scripts/build-candidate-artifact-manifest.mjs
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # S291: cascade-resync the release-proof. It derives candidateBuildSha +
          # generatedAt from api/staging-health.json, so refreshing staging parity
          # above (without regenerating release-proof) strands api/release-proof.json
          # stale — a false candidate SHA on the release-integrity artifact and a red
          # `build-release-proof --check` on every post-cron `npm run build:check`.
          # Regenerate it here (same order as the npm build: release-proof before
          # status-proof), validate byte-parity, and stage it with the rest.
          node scripts/build-release-proof.mjs
          node scripts/build-status-proof.mjs
          # S291 cascade-resync: api/citation.json embeds the live uptime figure
          # via status-proof.json (e.g. "Uptime 47.6% over the last 694 checks").
          # This cron refreshes uptime→status-proof but historically never
          # regenerated citation, stranding it stale until a human closeout — a
          # red `build-citation --check` on every post-cron build:check. Rebuild
          # it here (after status-proof, its source) and stage it below.
          node scripts/build-citation.mjs
          # Validate every truth artifact this skip-CI publisher can stage.
          # Any red aborts before git add/commit, so the next human push never
          # inherits an invisible generated-data failure.
          node scripts/check-uptime-contract.mjs
          node scripts/build-worker-route-provenance.mjs --check
          node scripts/build-worker-route-history.mjs --check
          node scripts/build-public-status.mjs --check
          node scripts/build-deploy-currency.mjs --check
          node scripts/build-security-posture.mjs --check
          node scripts/build-candidate-artifact-manifest.mjs --check
          node scripts/build-geo-vitals.mjs --check
          node scripts/check-staging-parity.mjs --check
          node scripts/build-release-proof.mjs --check
          node scripts/build-status-proof.mjs --check
          node scripts/build-citation.mjs --check
          # S324 cascade-resync: these crons commit sources of the CANON-054 public
          # stats surface and the CANON-048 intent map. Committing a source without
          # re-deriving its consumer strands the consumer stale on the live site —
          # the exact defect that left api/changelog-narrative.json a build behind.
          node scripts/build-intent-map.mjs
          node scripts/build-stats-surface.mjs
          node scripts/build-intent-map.mjs --check
          node scripts/build-stats-surface.mjs --check
          node scripts/check-ndjson-integrity.mjs
          git add api/uptime.json api/worker-route-provenance.json api/worker-route-history.json data/worker-route-history.ndjson api/public-status.json api/deploy-currency.json api/security-posture.json api/candidate-artifact-manifest.json data/uptime-history.ndjson api/geo-vitals.json api/staging-health.json api/release-proof.json api/status-proof.json api/citation.json api/intent-map.json data/stats-surface.json stats.json api/ecosystem-stats.json
          if git diff --cached --quiet; then
            echo "Nothing staged."; exit 0
          fi
          git commit -m "chore(uptime): publish availability + geo-vitals + staging parity [skip ci]"
          # S316 — same single-shot push shape that lost a whole analytics window
          # to a transient GitHub 500. This cron runs every 30 minutes alongside
          # several other publishers, so it is the most race-prone of them all.
          #
          # S341 — and being the most race-prone, it is where the retry loop's real
          # defect surfaced: it retried, but it could not RECOVER. A rebase conflict
          # left the repo detached mid-rebase, so attempts 2-4 each failed instantly
          # on "unmerged files" and the availability surface went unpublished. The
          # loop now lives in one shared, gated helper (scripts/ci/publish-push.sh);
          # --resync repairs the derived closure of anything the rebase brought in,
          # which is the cascade-width class S340 had to repair by hand.
          bash scripts/ci/publish-push.sh "uptime publish" --resync
