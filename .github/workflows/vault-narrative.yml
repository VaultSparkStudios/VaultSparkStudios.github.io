name: Generate Vault Narrative

on:
  schedule:
    - cron: '0 13 * * *'  # daily at 13:00 UTC (~9am ET)
  workflow_dispatch:

jobs:
  narrative:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Refresh public intelligence snapshot
        # Feeds /oracle/, /studio-pulse/, and the homepage Studio Spine. The
        # commit step below MUST stage api/public-intelligence.json or this
        # daily regeneration is discarded and those surfaces go stale (the
        # 2026-06-10 "Oracle not refreshing" report — the feed was rebuilt
        # here every day but never committed).
        run: node scripts/generate-public-intelligence.mjs

      - name: Close the public evidence graph
        # S291 cascade-resync: api/citation.json embeds dayOf(public-intelligence
        # .generatedAt) in its portfolio claim. This workflow bumps that feed
        # daily but historically never rebuilt citation, stranding it across day
        # boundaries (red build-citation --check on the next human build:check).
        # Rebuild + stage it below.
        #
        # S293: a second, longer strand on the same feed. api/public-status.json
        # derives its studio counts + generatedAt from public-intelligence, and
        # api/status-proof.json embeds public-status — so this daily bump also
        # stranded BOTH. It stayed invisible while public-status had no node in
        # config/evidence-graph.json; modelling it made the chain checkable.
        # Order mirrors `npm run build`: public-status → manifest → release-proof
        # → status-proof → citation (each consumes the one before it).
        run: |
          node scripts/build-public-status.mjs
          node scripts/build-candidate-artifact-manifest.mjs
          node scripts/build-release-proof.mjs
          node scripts/build-status-proof.mjs
          node scripts/build-citation.mjs
          node scripts/build-public-status.mjs --check
          node scripts/build-candidate-artifact-manifest.mjs --check
          node scripts/build-release-proof.mjs --check
          node scripts/build-status-proof.mjs --check --check-content
          node scripts/build-citation.mjs --check
          # S324 cascade-resync: these crons commit sources of the CANON-054 public
          # stats surface and the CANON-048 intent map. Committing a source without
          # re-deriving its consumer strands the consumer stale on the live site —
          # the exact defect that left api/changelog-narrative.json a build behind.
          node scripts/build-intent-map.mjs
          node scripts/build-stats-surface.mjs
          node scripts/build-intent-map.mjs --check
          node scripts/build-stats-surface.mjs --check

      - name: Generate vault-narrative.json
        env:
          HETZNER_INFERENCE_API_KEY: ${{ secrets.HETZNER_INFERENCE_API_KEY }}
          HETZNER_INFERENCE_BASE_URL: ${{ secrets.HETZNER_INFERENCE_BASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/generate-vault-narrative.mjs

      - name: Commit updated narrative
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add api/public-intelligence.json api/vault-narrative.json api/vault-narrative-history.json api/candidate-artifact-manifest.json api/public-status.json api/release-proof.json api/status-proof.json api/citation.json api/intent-map.json data/stats-surface.json stats.json api/ecosystem-stats.json journal/dispatches/feed.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh vault narrative [skip ci]"
            bash scripts/ci/publish-push.sh "vault narrative" --resync
          else
            echo "Vault narrative unchanged, skipping commit"
          fi
