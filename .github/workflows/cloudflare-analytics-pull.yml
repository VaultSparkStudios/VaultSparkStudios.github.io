name: Cloudflare Analytics Pull

on:
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch:

concurrency:
  group: cloudflare-analytics-pull
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # S316 — build-deploy-currency resolves the deployed sha against repo
          # history. On the default depth-1 shallow clone that lookup always
          # fails, so a perfectly healthy deploy was published as `diverged`
          # with null commit distance. Full history is required for the probe
          # to tell real divergence from a truncated clone.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Pull complete-day Cloudflare aggregates
        env:
          CLOUDFLARE_ANALYTICS_READ_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_READ_TOKEN }}
        run: |
          node scripts/pull-cloudflare-analytics.mjs
          node scripts/build-analytics-summary.mjs
          node scripts/build-ecosystem-stats-page.mjs
          # S324 cascade-resync: this cron commits api/deploy-currency.json and
          # api/public-status.json, sources of the CANON-048 intent map.
          node scripts/build-intent-map.mjs
          node scripts/build-stats-surface.mjs
          node scripts/build-shell-assets.mjs
          # Analytics feeds are inputs to the public release/proof graph. Close
          # the full derived cascade before the [skip ci] commit is published.
          node scripts/build-candidate-artifact-manifest.mjs
          node scripts/build-deploy-currency.mjs
          node scripts/build-release-proof.mjs
          node scripts/build-status-proof.mjs
          node scripts/build-citation.mjs
      - name: Validate analytics contracts
        run: |
          node scripts/pull-cloudflare-analytics.mjs --self-test
          node scripts/pull-cloudflare-analytics.mjs --check
          node scripts/build-analytics-summary.mjs --self-test
          node scripts/build-analytics-summary.mjs --check
          node scripts/build-ecosystem-stats-page.mjs --self-test
          node scripts/build-ecosystem-stats-page.mjs --check
      - name: Commit bounded public analytics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cloudflare-analytics.json data/cloudflare-analytics-history.ndjson api/ecosystem-analytics.json api/ecosystem-stats.json api/analytics-summary.json data/stats-surface.json stats.json assets/*.shell-*.js assets/*.shell-*.css stats/ index.html status/index.html sw.js api/candidate-artifact-manifest.json api/deploy-currency.json api/release-proof.json api/status-proof.json api/citation.json api/intent-map.json
          if git diff --cached --quiet; then
            echo "No new complete-day analytics"
          else
            git commit -m "chore: refresh public Cloudflare analytics [skip ci]"
            # S316 — this was a single-shot `pull --rebase && push`. On
            # 2026-08-14 the push hit `remote: Internal Server Error` (HTTP 500);
            # the commit existed only on the runner and died with it, so that
            # window's analytics were never published and the job went red for a
            # reason that had nothing to do with analytics. The same shape also
            # loses a run to an ordinary push race with this repo's other crons.
            # Retry with backoff, re-basing each time; a genuine permission or
            # conflict error still fails loudly after the attempts are spent.
            # S341 — retrying is not recovering. That loop swallowed a failed
            # rebase with `|| true`, so a content conflict left the repo detached
            # mid-rebase and attempts 2-4 could only fail on "unmerged files".
            # One shared, gated implementation now owns the landing transaction;
            # --resync repairs the derived closure of whatever the rebase brought
            # in, which matters here because this step stages status-proof,
            # release-proof, citation, intent-map and the stats surface.
            bash scripts/ci/publish-push.sh "analytics publish" --resync
          fi
