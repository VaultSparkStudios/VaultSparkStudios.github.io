name: Generate Leaderboard API

on:
  schedule:
    - cron: '15 6 * * *'   # daily at 06:15 UTC
  workflow_dispatch:

jobs:
  leaderboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Generate leaderboard JSON files
        run: node scripts/generate-leaderboard-api.mjs

      - name: Commit updated API files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add api/leaderboard/v1/*.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update leaderboard API data [skip ci]"
            bash scripts/ci/publish-push.sh "leaderboard API" --resync
          else
            echo "No changes to leaderboard data, skipping commit"
          fi
