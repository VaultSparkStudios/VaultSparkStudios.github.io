name: Regenerate OG Images

on:
  push:
    paths:
      - 'scripts/generate-og.mjs'
      - 'scripts/package.json'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        # scripts/package-lock.json is gitignored in this repo (.gitignore line 3),
        # so `npm ci` (and `cache: 'npm'`) fail in CI. Use `npm install` — same
        # pattern as accessibility.yml / cloudflare-worker-deploy.yml.
        run: cd scripts && npm install --no-audit --no-fund

      - name: Generate OG images
        run: cd scripts && node generate-og.mjs

      - name: Commit generated images
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/og-*.png
          if git diff --cached --quiet; then
            echo "No OG image changes."
          else
            git commit -m "chore: regenerate OG images [skip ci]"
            bash scripts/ci/publish-push.sh "OG images"
          fi
