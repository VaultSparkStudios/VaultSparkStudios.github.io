name: Regenerate OG Images

on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate-og.mjs'
      - 'scripts/package.json'
  workflow_dispatch:

jobs:
  generate:
    # Release tags may generate previews, but must never mutate a detached ref.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install dependencies
        # scripts/package-lock.json is gitignored in this repo (.gitignore line 3),
        # so `npm ci` (and `cache: 'npm'`) fail in CI. Use `npm install` — same
        # pattern as accessibility.yml / cloudflare-worker-deploy.yml.
        run: cd scripts && npm install --no-audit --no-fund

      - name: Generate OG images
        run: cd scripts && node generate-og.mjs

      - name: Commit generated images
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/og-*.png
          if git diff --cached --quiet; then
            echo "No OG image changes."
          else
            git commit -m "chore: regenerate OG images [skip ci]"
            bash scripts/ci/publish-push.sh "OG images"
          fi
