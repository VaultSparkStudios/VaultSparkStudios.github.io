name: Accessibility Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

jobs:
  # ── Playwright + axe-core/playwright ──────────────────────
  playwright-axe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Install dependencies
        # Locked install: package-lock.json is committed and install scripts are
        # disabled, so CI resolves exactly the reviewed dependency tree.
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Compile canonical local candidate
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Cloudflare's WAF returns managed-challenge HTML to GitHub Actions runner
      # IPs, so pointing Playwright at https://vaultsparkstudios.com/ audits the
      # challenge shell (no --text/--bg CSS custom props → contrast ratio NaN
      # and all page.goto() lands on the wrong DOM). Running axe against a
      # local preview server built from the same repo artifacts audits the real
      # shipped HTML/CSS/JS without the WAF in the way.
      - name: Start local preview server
        run: |
          node scripts/local-preview-server.mjs &
          echo "PREVIEW_PID=$!" >> $GITHUB_ENV
        env:
          LOCAL_PREVIEW_HOST: 127.0.0.1
          LOCAL_PREVIEW_PORT: '4173'

      - name: Wait for local preview
        run: timeout 30 bash -c 'until curl --fail --silent --output /dev/null http://127.0.0.1:4173/; do sleep 0.5; done'

      - name: Run axe accessibility tests via Playwright
        run: npx playwright test tests/accessibility.spec.js --project=chromium
        env:
          BASE_URL: http://127.0.0.1:4173
          VAULT_TEST_EMAIL: ${{ secrets.VAULT_TEST_EMAIL }}
          VAULT_TEST_PASSWORD: ${{ secrets.VAULT_TEST_PASSWORD }}

      - name: Stop local preview
        if: always()
        run: |
          if [ -n "${PREVIEW_PID:-}" ]; then kill "$PREVIEW_PID" || true; fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-a11y-report
          path: playwright-report/
          retention-days: 7

  # Served production remains supplementary; authoritative local scans above are unchanged.
  axe-cli:
    name: Served production accessibility (supplementary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      # Reuses the locked Playwright browser runtime.
      - name: Install canonical Playwright browser
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Audit six served production routes (supplementary — non-blocking)
        continue-on-error: true
        run: node scripts/audit-served-accessibility.mjs --audit-served-production
      - name: Upload served accessibility results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: axe-results
          path: axe-results/
          retention-days: 7
