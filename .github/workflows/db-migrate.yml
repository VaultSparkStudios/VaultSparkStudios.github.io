name: Run Supabase Migrations

on:
  workflow_dispatch:
    inputs:
      files:
        description: 'Comma-separated migration files to run (leave blank for all pending)'
        required: false
        type: string
      dry_run:
        description: 'Dry run — validate SQL without executing'
        required: false
        type: boolean
        default: false

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Determine migration files
        id: files
        # Inputs reach the shell only through environment variables, never by
        # interpolation into the script. There is no default list: replaying
        # old migrations would overwrite later function definitions, including
        # security fixes. Name the files explicitly.
        env:
          INPUT_FILES: ${{ inputs.files }}
        run: |
          if [ -z "$INPUT_FILES" ]; then
            echo "::error::No migration files named. Pass a comma-separated list of supabase/**/*.sql paths."
            exit 1
          fi
          IFS=',' read -ra CANDIDATES <<< "$INPUT_FILES"
          CLEAN=""
          for raw in "${CANDIDATES[@]}"; do
            f="$(printf '%s' "$raw" | tr -d '[:space:]')"
            if ! printf '%s' "$f" | grep -Eq '^supabase/(migrations/)?[A-Za-z0-9._-]+\.sql$'; then
              echo "::error::Rejected path (must match supabase/[migrations/]<name>.sql)"
              exit 1
            fi
            CLEAN="${CLEAN:+$CLEAN,}$f"
          done
          echo "list=$CLEAN" >> "$GITHUB_OUTPUT"

      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          FILE_LIST: ${{ steps.files.outputs.list }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          IFS=',' read -ra FILES <<< "$FILE_LIST"
          FAILED=0

          for file in "${FILES[@]}"; do
            file=$(echo "$file" | xargs)
            if [ ! -f "$file" ]; then
              echo "::error::File not found: $file"
              FAILED=1
              continue
            fi

            echo "──────────────────────────────────────"
            echo "Running: $file"
            echo "──────────────────────────────────────"

            if [ "$DRY_RUN" = "true" ]; then
              echo "DRY RUN — wrapping in transaction + rollback"
              (echo "BEGIN;" && cat "$file" && echo "ROLLBACK;") | psql "$DATABASE_URL" 2>&1
            else
              psql "$DATABASE_URL" --set ON_ERROR_STOP=1 -f "$file" 2>&1
            fi

            if [ $? -ne 0 ]; then
              echo "::error::Migration failed: $file"
              FAILED=1
              break
            else
              echo "✓ $file — success"
            fi
          done

          if [ $FAILED -ne 0 ]; then
            echo "::error::Migration run had failures. Check logs above."
            exit 1
          fi

          echo "✓ All migrations completed successfully"

      - name: Summary
        if: always()
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          FILE_LIST: ${{ steps.files.outputs.list }}
        run: |
          echo "## Migration Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Dry run:** $DRY_RUN" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Files:** $FILE_LIST" >> "$GITHUB_STEP_SUMMARY"
