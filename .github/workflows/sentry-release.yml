name: Sentry Release

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Record a production Sentry release only for a confirmed ready promotion"
        required: true
        default: false
        type: boolean
  push:
    branches: [main]

jobs:
  sentry-release:
    name: Create Sentry Release
    runs-on: ubuntu-latest
    # Requires SENTRY_AUTH_TOKEN secret set in repo Settings
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Evaluate production promotion gate
        id: promotion-gate
        run: node scripts/check-production-promotion-gate.mjs --emit-github-output
        env:
          PRODUCTION_CONFIRM: ${{ inputs.confirm_production }}

      - name: Install release-ceremony browser dependencies
        if: steps.promotion-gate.outputs.allowed == 'true'
        # S319: this step's NAME promised browsers; it installed only npm packages,
        # so the ceremony it feeds failed in seconds with nothing to launch and the
        # result read as a failing quality gate rather than a missing dependency.
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium firefox webkit

      - name: Run canonical release ceremony
        if: steps.promotion-gate.outputs.allowed == 'true'
        run: >-
          node scripts/run-release-ceremony.mjs
          --url=https://website.staging.vaultsparkstudios.com
          --ci --require-ready

      - name: Promotion held — Sentry production receipt skipped
        if: steps.promotion-gate.outputs.allowed != 'true'
        run: echo "Production promotion is held; Sentry production release skipped."

      - name: Create Sentry release
        if: steps.promotion-gate.outputs.allowed == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: vaultspark-studios
          SENTRY_PROJECT: "4511104933298176"
        run: |
          npx --yes @sentry/cli@latest releases new "${{ github.sha }}"
          npx @sentry/cli releases set-commits "${{ github.sha }}" --auto --ignore-missing
          npx @sentry/cli releases deploys "${{ github.sha }}" new -e production
          npx @sentry/cli releases finalize "${{ github.sha }}"
