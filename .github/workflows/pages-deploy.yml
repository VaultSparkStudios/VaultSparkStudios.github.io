name: Cloudflare Pages Deploy

# S175 cf-pages-origin-migration — production origin is Cloudflare Pages.
# Every push to main deploys the git-tracked tree (same snapshot rule as the
# original migration). GitHub Pages keeps building in parallel as the warm
# rollback origin (rollback = restore the 4 A records, see DECISIONS S175).
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # S219 safety net: data-refresh workflows (vault-narrative, rum-pull,
    # ci-status-beacon, refresh-live-data) commit with [skip ci], which skips
    # EVERY GitHub Actions workflow — including this deploy. A periodic deploy of
    # the current main tree guarantees those committed-but-undeployed feeds still
    # reach prod even if an explicit dispatch was missed. Pages uploads are
    # content-hashed, so an unchanged tree costs nothing.
    - cron: "40 */6 * * *" # every 6h at :40

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skip beacon/data-only commits? No — data commits (RUM history) change
    # served JSON artifacts, so every push deploys. Pages uploads are
    # content-hashed; unchanged files cost nothing.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build clean dist (git-tracked files only)
        run: |
          mkdir -p /tmp/pages-dist
          git archive HEAD | tar -x -C /tmp/pages-dist

      - name: Stamp honest deployed SHA into build-sha.json
        # S219 deploy-currency honesty (CANON-031). generate-build-sha.mjs captures
        # the LOCAL HEAD at build time, but that output is then committed as a NEW
        # sha — so the committed build-sha.json is structurally always one commit
        # behind and check-pages-deploy reads a false "prod stale" mismatch. Here,
        # at the moment of deploy, we KNOW the true deployed commit — stamp it so
        # the served build-sha.json reflects exactly what prod is running.
        run: |
          SHA=$(git rev-parse HEAD)
          NOW=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
          DAY=$(date -u +%Y-%m-%d)
          mkdir -p /tmp/pages-dist/api
          printf '{\n  "schemaVersion": "1.0",\n  "generatedAt": "%s",\n  "sha": "%s",\n  "builtAt": "%s",\n  "deployedBy": "pages-deploy"\n}\n' "$DAY" "$SHA" "$NOW" > /tmp/pages-dist/api/build-sha.json
          echo "stamped deployed build-sha: $SHA"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 pages deploy /tmp/pages-dist --project-name vaultsparkstudios-website --branch main --commit-dirty=true

      - name: Purge edge HTML cache
        env:
          CF_PURGE_TOKEN: ${{ secrets.CF_PURGE_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_PURGE_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' | head -c 200

      - name: Post-purge edge liveness check
        # S239: after every cache purge (purge_everything) the first HTML request hits
        # the Worker uncached. This catches the S239 P0 class (HTMLRewriter double-clone
        # deadlock) immediately — a hang means the Worker can't serve HTML. Uses
        # smoke-live --edge-only (5s timeout × 2 attempts) so the check finishes in
        # ≤15s regardless. Worker deploy has its own full smoke + rollback; this is the
        # Pages-side tripwire for the cache-purge exposure window.
        run: |
          sleep 3
          node scripts/smoke-live.mjs --edge-only
