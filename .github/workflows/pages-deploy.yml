name: Cloudflare Pages Deploy

# S175 cf-pages-origin-migration — production origin is Cloudflare Pages.
# Pushes and schedules evaluate the promotion interlock but cannot deploy.
# Routed production changes only on a ready, manually confirmed dispatch.
# GitHub Pages keeps building independently as the public warm rollback origin
# (rollback = restore the 4 A records, see DECISIONS S175 and D-S289.8).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Promote the current ready candidate to production"
        required: true
        default: false
        type: boolean
      # S294 content-hotfix lane. The full interlock couples static content to
      # identity/Supabase readiness, so a broken public page could not be repaired
      # while unrelated migration work was pending. This lane rebuilds the tree
      # that is ALREADY deployed and overlays only allowlisted content files —
      # blast radius is exactly the listed paths, and nothing in the identity
      # backlog is promoted. It does NOT release the hold and cannot deploy
      # anything executable, edge-configuring, or unrecognised.
      confirm_hotfix:
        description: "Content hotfix: overlay specific content files onto the deployed tree"
        required: false
        default: false
        type: boolean
      hotfix_paths:
        description: "Space-separated content paths to promote (markup outside auth, inert assets, api/*.json)"
        required: false
        default: ""
        type: string
      baseline_sha:
        description: "Commit already in production to rebuild from (blank = deployedSha in api/deploy-currency.json)"
        required: false
        default: ""
        type: string
      # S300 content lane. The S294 hotfix lane above proved the shape works but
      # is hand-scoped: an operator enumerates the files, and the first real use
      # got that enumeration wrong and shipped a 404. This lane derives the file
      # set from the diff instead — it promotes every content-pure path between
      # the deployed baseline and HEAD, and withholds everything else AT the
      # baseline. Nothing in the identity backlog moves, and no hold is released:
      # this is a narrower promotion path with its OWN explicit confirmation,
      # deliberately mirroring confirm_production rather than bypassing it.
      # Push and schedule still cannot deploy anything.
      confirm_content:
        description: "Content lane: promote every content-pure path (auto-scoped from the diff)"
        required: false
        default: false
        type: boolean
  schedule:
    # S289: schedules retain a visible promotion-gate receipt, but the fail-closed
    # interlock never lets a schedule deploy. Feed promotion is intentionally held
    # with the rest of the candidate until a ready, manually confirmed dispatch.
    - cron: "40 */6 * * *" # every 6h at :40

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Push/schedule runs are source-publication receipts only while held. Every
    # production-mutating step below consumes the same promotion-gate output.
    steps:
      - uses: actions/checkout@v7
        with:
          # S294: the hotfix lane rebuilds from a commit already in production, so
          # that commit must be present. Depth 1 would make `git archive <baseline>`
          # fail. Full history is also what the deploy-currency comparison needs.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Evaluate production promotion gate
        id: promotion-gate
        run: node scripts/check-production-promotion-gate.mjs --emit-github-output
        env:
          PRODUCTION_CONFIRM: ${{ inputs.confirm_production }}

      - name: Install release-ceremony browser dependencies
        if: steps.promotion-gate.outputs.allowed == 'true'
        # S319: this step installed npm packages but never the Playwright BROWSER
        # BINARIES, so the ceremony's staging-browser step could not launch a
        # browser and failed in six seconds — writing a rejected receipt that
        # looked like a failing gate rather than a missing dependency. The step
        # name promised browsers; only now does it deliver them. All three engines
        # are installed because tests/staging-release.spec.js runs the theme
        # matrix across chromium, firefox and webkit.
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium firefox webkit

      - name: Run canonical release ceremony
        if: steps.promotion-gate.outputs.allowed == 'true'
        run: >-
          node scripts/run-release-ceremony.mjs
          --url=https://website.staging.vaultsparkstudios.com
          --ci --require-ready

      - name: Upload release-ceremony evidence on failure
        # The ceremony deliberately discards subprocess stdout (validateReceipt
        # forbids retaining it), so a CI-only browser failure is otherwise
        # invisible: the run says "staging-browser-receipt: rejected" and the
        # receipt naming the actual failing assertion never leaves the runner.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: staging-release-browser-receipt
          path: |
            api/staging-release-browser.json
            api/release-ceremony.json
          if-no-files-found: warn
          retention-days: 7

      - name: Evaluate content hotfix gate
        id: hotfix-gate
        # Fail-closed and independent: only an explicitly listed, allowlisted set of
        # content files qualifies. Emits allowed=false rather than failing the job so
        # a rejected hotfix reads as "not authorised", not as a broken workflow.
        if: inputs.confirm_hotfix == true && steps.promotion-gate.outputs.allowed != 'true'
        # Dispatch input passes through env, never interpolated into the command —
        # a `${{ }}` splice into a shell line is a script-injection surface.
        env:
          HOTFIX_PATHS: ${{ inputs.hotfix_paths }}
          BASELINE_INPUT: ${{ inputs.baseline_sha }}
        run: |
          BASELINE="$BASELINE_INPUT"
          if [ -z "$BASELINE" ]; then
            BASELINE=$(node -e "process.stdout.write(require('./api/deploy-currency.json').deployedSha || '')")
          fi
          # --baseline makes the gate resolve every asset the overlaid markup
          # references against the tree that is actually deployed. Without it the
          # first real hotfix shipped a 404: HEAD's markup pointed at a shell hash
          # that only exists at HEAD, not in the deployed tree.
          node scripts/check-content-hotfix-gate.mjs \
            --paths "$HOTFIX_PATHS" \
            "--baseline=$BASELINE" \
            --emit-github-output

      - name: Evaluate content lane (auto-scoped purity partition)
        id: content-lane
        # Fail-closed and independent of the identity interlock, exactly like the
        # hotfix gate. Emits deployable=false rather than failing the job so a
        # candidate with nothing promotable reads as "nothing to ship", not as a
        # broken workflow. Only runs when the full promotion is NOT already
        # allowed — a full promotion supersedes it.
        if: inputs.confirm_content == true && steps.promotion-gate.outputs.allowed != 'true'
        env:
          BASELINE_INPUT: ${{ inputs.baseline_sha }}
        run: |
          set -euo pipefail
          BASELINE="$BASELINE_INPUT"
          if [ -z "$BASELINE" ]; then
            BASELINE=$(node -e "process.stdout.write(require('./api/deploy-currency.json').deployedSha || '')")
          fi
          if [ -z "$BASELINE" ]; then
            echo "no baseline sha available — probe deploy-currency first" >&2
            exit 1
          fi
          if ! git cat-file -e "$BASELINE"; then
            echo "baseline $BASELINE is not in this repository's history" >&2
            exit 1
          fi
          echo "content-lane baseline: $BASELINE"
          node scripts/check-content-lane-purity.mjs --range "$BASELINE..HEAD" --partition --emit-github-output

      - name: Resolve content-lane references against the deployed tree
        id: content-refs
        # NON-NEGOTIABLE. The S294 hotfix shipped a 404 because HEAD's markup
        # referenced a shell hash that existed only at HEAD, not in the tree
        # being deployed. Reuse the hotfix gate's --baseline resolution over this
        # auto-derived partition: a promoted page whose assets do not resolve in
        # the tree it lands in is a broken page, however pure its diff was.
        if: steps.content-lane.outputs.deployable == 'true'
        env:
          BASELINE_INPUT: ${{ inputs.baseline_sha }}
          LANE_PATHS: ${{ steps.content-lane.outputs.paths }}
        run: |
          set -euo pipefail
          BASELINE="$BASELINE_INPUT"
          if [ -z "$BASELINE" ]; then
            BASELINE=$(node -e "process.stdout.write(require('./api/deploy-currency.json').deployedSha || '')")
          fi
          node scripts/check-content-hotfix-gate.mjs \
            --paths "$LANE_PATHS" \
            "--baseline=$BASELINE" \
            --emit-github-output

      - name: Validate caller and Worker capability slice
        # A hash-named browser bundle is executable even though it is safe to
        # overlay. If it introduces a /v/* call, that route must be proven live
        # at production before the caller can promote. This is the S317 split-
        # release guard: Desk caller and Worker callee move as one capability.
        if: steps.hotfix-gate.outputs.allowed == 'true' || steps.content-refs.outputs.allowed == 'true'
        env:
          LANE_PATHS: ${{ steps.content-refs.outputs.paths || steps.hotfix-gate.outputs.paths }}
        run: >-
          node scripts/check-content-capability-slice.mjs
          --paths "$LANE_PATHS"
          --json-out .cache/content-capability-slice.json

      - name: Promotion held — no production mutation
        if: steps.promotion-gate.outputs.allowed != 'true' && steps.hotfix-gate.outputs.allowed != 'true' && steps.content-refs.outputs.allowed != 'true'
        run: echo "Production promotion is held and no content hotfix or content-lane promotion was authorised; source-control update only."

      - name: Validate discovery content partition
        if: steps.content-refs.outputs.allowed == 'true'
        env:
          LANE_PATHS: ${{ steps.content-refs.outputs.paths }}
        run: node scripts/check-discovery-content-lane.mjs --paths "$LANE_PATHS" --json-out .cache/discovery-content-result.json

      - name: Build clean dist (git-tracked files only)
        if: steps.promotion-gate.outputs.allowed == 'true'
        run: |
          mkdir -p /tmp/pages-dist
          git archive HEAD | tar -x -C /tmp/pages-dist
          # S300: git archive publishes the ENTIRE tracked tree — /.cache/,
          # /context/, /logs/, /scripts/ and /prompts/ all served 200 on
          # production. Prune repo-internal paths, and REFUSE the deploy if
          # pruning would break any route advertised by sitemap/agents/llms.
          node scripts/prune-served-surface.mjs --dist /tmp/pages-dist

      - name: Stamp honest deployed SHA into build-sha.json
        if: steps.promotion-gate.outputs.allowed == 'true'
        # S219 deploy-currency honesty (CANON-031). generate-build-sha.mjs captures
        # the LOCAL HEAD at build time, but that output is then committed as a NEW
        # sha — so the committed build-sha.json is structurally always one commit
        # behind and check-pages-deploy reads a false "prod stale" mismatch. Here,
        # at the moment of deploy, we KNOW the true deployed commit — stamp it so
        # the served build-sha.json reflects exactly what prod is running.
        run: |
          SHA=$(git rev-parse HEAD)
          NOW=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
          DAY=$(date -u +%Y-%m-%d)
          mkdir -p /tmp/pages-dist/api
          # S319: one declared shape across all four producers of this artifact.
          # Content-lane provenance is emitted as null rather than omitted, so a
          # consumer reading baselineSha never has to distinguish "not applicable"
          # from "this producer forgot".
          printf '{\n  "schemaVersion": "1.1",\n  "generatedAt": "%s",\n  "sha": "%s",\n  "builtAt": "%s",\n  "deployedBy": "pages-deploy",\n  "baselineSha": null,\n  "contentLaneHead": null,\n  "contentLanePaths": null,\n  "contentLanePathSetSha256": null,\n  "workflowRunId": null\n}\n' "$DAY" "$SHA" "$NOW" > /tmp/pages-dist/api/build-sha.json
          echo "stamped deployed build-sha: $SHA"

      - name: Build hotfix dist (deployed tree + authorised content overlay)
        if: steps.hotfix-gate.outputs.allowed == 'true'
        # Rebuild EXACTLY what production already serves, then copy only the gated
        # paths over it. The resulting tree differs from live by those files alone,
        # so none of the pending identity/Supabase work is promoted.
        env:
          BASELINE_INPUT: ${{ inputs.baseline_sha }}
          HOTFIX_RESOLVED: ${{ steps.hotfix-gate.outputs.paths }}
        run: |
          set -euo pipefail
          BASELINE="$BASELINE_INPUT"
          if [ -z "$BASELINE" ]; then
            BASELINE=$(node -e "process.stdout.write(require('./api/deploy-currency.json').deployedSha || '')")
          fi
          if [ -z "$BASELINE" ]; then
            echo "no baseline sha available — supply baseline_sha or probe deploy-currency first" >&2
            exit 1
          fi
          if ! git cat-file -e "$BASELINE"; then
            echo "baseline $BASELINE is not in this repository's history" >&2
            exit 1
          fi
          echo "hotfix baseline: $BASELINE"
          mkdir -p /tmp/pages-dist
          git archive "$BASELINE" | tar -x -C /tmp/pages-dist
          node scripts/prune-served-surface.mjs --dist /tmp/pages-dist
          for p in $HOTFIX_RESOLVED; do
            mkdir -p "/tmp/pages-dist/$(dirname "$p")"
            cp "$p" "/tmp/pages-dist/$p"
            echo "overlaid $p"
          done
          # Honesty: production is the BASELINE tree plus a patch — it is NOT at HEAD.
          # Stamping HEAD here would make api/deploy-currency.json report production
          # as current when 400+ files of pending work are still unpromoted.
          NOW=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
          DAY=$(date -u +%Y-%m-%d)
          mkdir -p /tmp/pages-dist/api
          printf '{\n  "schemaVersion": "1.1",\n  "generatedAt": "%s",\n  "sha": "%s",\n  "builtAt": "%s",\n  "deployedBy": "pages-deploy-content-hotfix",\n  "baselineSha": "%s",\n  "contentLaneHead": null,\n  "contentLanePaths": null,\n  "contentLanePathSetSha256": null,\n  "workflowRunId": null,\n  "hotfixPaths": "%s"\n}\n' \
            "$DAY" "$BASELINE" "$NOW" "$BASELINE" "$HOTFIX_RESOLVED" > /tmp/pages-dist/api/build-sha.json
          echo "stamped baseline sha (NOT HEAD) so deploy-currency stays honest"

      - name: Build content-lane dist (deployed tree + content-pure overlay)
        if: steps.content-refs.outputs.allowed == 'true'
        # Same construction as the hotfix lane — rebuild EXACTLY what production
        # serves, then overlay only the promotable partition. Every withheld path
        # keeps its baseline copy, so no identity work is promoted.
        env:
          BASELINE_INPUT: ${{ inputs.baseline_sha }}
          LANE_PATHS: ${{ steps.content-refs.outputs.paths }}
        run: |
          set -euo pipefail
          BASELINE="$BASELINE_INPUT"
          if [ -z "$BASELINE" ]; then
            BASELINE=$(node -e "process.stdout.write(require('./api/deploy-currency.json').deployedSha || '')")
          fi
          mkdir -p /tmp/pages-dist
          git archive "$BASELINE" | tar -x -C /tmp/pages-dist
          node scripts/prune-served-surface.mjs --dist /tmp/pages-dist
          count=0
          PATH_SET_SHA=$(printf '%s\n' $LANE_PATHS | sort | sha256sum | awk '{print $1}')
          for p in $LANE_PATHS; do
            mkdir -p "/tmp/pages-dist/$(dirname "$p")"
            cp "$p" "/tmp/pages-dist/$p"
            count=$((count+1))
          done
          echo "content-lane overlaid $count path(s) onto $BASELINE"
          # Honesty (CANON-031): production is the BASELINE tree plus a content
          # patch — it is NOT at HEAD. Stamping HEAD would make deploy-currency
          # report production current while the identity backlog is unpromoted,
          # which is the exact lie the S300 work removed.
          NOW=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
          DAY=$(date -u +%Y-%m-%d)
          mkdir -p /tmp/pages-dist/api
          printf '{\n  "schemaVersion": "1.1",\n  "generatedAt": "%s",\n  "sha": "%s",\n  "baselineSha": "%s",\n  "builtAt": "%s",\n  "deployedBy": "pages-deploy-content-lane",\n  "contentLaneHead": "%s",\n  "contentLanePaths": "%s",\n  "contentLanePathSetSha256": "%s",\n  "workflowRunId": "%s"\n}\n' \
            "$DAY" "$BASELINE" "$BASELINE" "$NOW" "$GITHUB_SHA" "$count paths" "$PATH_SET_SHA" "$GITHUB_RUN_ID" > /tmp/pages-dist/api/build-sha.json
          mkdir -p /tmp/pages-dist/data
          curl -fsS https://vaultsparkstudios-website.pages.dev/data/content-deploy-history.ndjson -o /tmp/content-deploy-history.ndjson || : > /tmp/content-deploy-history.ndjson
          node scripts/build-content-release-receipt.mjs \
            --paths "$LANE_PATHS" \
            --baseline "$BASELINE" \
            --head "$GITHUB_SHA" \
            --workflow-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --discovery-result .cache/discovery-content-result.json \
            --history-source /tmp/content-deploy-history.ndjson \
            --output /tmp/pages-dist/api/content-deploy-receipt.json \
            --history-output /tmp/pages-dist/data/content-deploy-history.ndjson \
            --continuity-output /tmp/pages-dist/api/content-release-continuity.json

      - name: Deploy to Cloudflare Pages
        if: steps.promotion-gate.outputs.allowed == 'true' || steps.hotfix-gate.outputs.allowed == 'true' || steps.content-refs.outputs.allowed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 pages deploy /tmp/pages-dist --project-name vaultsparkstudios-website --branch main --commit-dirty=true

      - name: Purge edge HTML cache
        if: steps.promotion-gate.outputs.allowed == 'true' || steps.hotfix-gate.outputs.allowed == 'true' || steps.content-refs.outputs.allowed == 'true'
        env:
          CF_PURGE_TOKEN: ${{ secrets.CF_PURGE_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_PURGE_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' | head -c 200

      # S304: purge_everything does not evict a URL-keyed edge layer that has
      # been observed serving stale negative 404s for newly promoted paths
      # (clean URL 404 · query-string 200) until TTL expiry. Purge each
      # promoted URL explicitly and VERIFY eviction with clean-URL probes —
      # the API success flag alone has been observed lying in both directions.
      - name: Purge promoted URLs by file (URL-keyed edge entries)
        if: steps.hotfix-gate.outputs.allowed == 'true' || steps.content-refs.outputs.allowed == 'true'
        env:
          CF_PURGE_TOKEN: ${{ secrets.CF_PURGE_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          LANE_PATHS: ${{ steps.content-refs.outputs.paths || steps.hotfix-gate.outputs.paths }}
        run: node scripts/purge-promoted-urls.mjs

      - name: Post-purge edge liveness check
        if: steps.promotion-gate.outputs.allowed == 'true' || steps.hotfix-gate.outputs.allowed == 'true' || steps.content-refs.outputs.allowed == 'true'
        # S239: after every cache purge (purge_everything) the first HTML request hits
        # the Worker uncached. This catches the S239 P0 class (HTMLRewriter double-clone
        # deadlock) immediately — a hang means the Worker can't serve HTML. Uses
        # smoke-live --edge-only (5s timeout × 2 attempts) so the check finishes in
        # ≤15s regardless. Worker deploy has its own full smoke + rollback; this is the
        # Pages-side tripwire for the cache-purge exposure window.
        run: |
          sleep 3
          node scripts/smoke-live.mjs --edge-only

      - name: Served feed contract (status + content-type)
        if: steps.promotion-gate.outputs.allowed == 'true' || steps.hotfix-gate.outputs.allowed == 'true' || steps.content-refs.outputs.allowed == 'true'
        # S300: verifies what was actually SERVED, not what was built. A generator
        # self-test proves the feed is well-formed; nothing proved the reader
        # receives it. Honest-404s pass (the content lane deliberately withholds
        # paths); a 200 carrying HTML does not. Challenge/network → unverified,
        # exit 0 — a gate that reddens on an unreachable network gets muted.
        run: node scripts/check-served-feed-content-type.mjs

      - name: Verify served discovery content partition
        if: steps.content-refs.outputs.allowed == 'true'
        env:
          LANE_PATHS: ${{ steps.content-refs.outputs.paths }}
        run: node scripts/check-discovery-content-lane.mjs --paths "$LANE_PATHS" --origin https://vaultsparkstudios-website.pages.dev

      # S313: /news previously reached origin while a reader still saw the old
      # description. A purge success flag and HTTP 200 do not prove candidate
      # bytes are what the canonical URL serves. When News is in the promoted
      # partition, compare its exact description and one referenced AVIF against
      # HEAD, and assert the public icon contract in the served HTML.
      - name: Exact live News freshness (description, icon contract, art bytes)
        if: steps.promotion-gate.outputs.allowed == 'true' || contains(steps.hotfix-gate.outputs.paths, 'news/index.html') || contains(steps.content-refs.outputs.paths, 'news/index.html')
        env:
          # GitHub datacenter IPs are challenged by the canonical edge. Verify
          # exact deployed bytes at the unchallenged Pages origin, then require
          # the custom domain to answer either with those exact bytes or its
          # documented fast 403 challenge (the preceding edge smoke rejects
          # hangs/5xx).
          NEWS_RELEASE_CONTENT_ORIGIN: https://vaultsparkstudios-website.pages.dev
        run: |
          # Pages can acknowledge a deployment a few seconds before every
          # pages.dev edge serves the new HTML. Keep the exact-byte gate strict,
          # but give propagation a short bounded window before failing closed.
          for attempt in 1 2 3 4 5; do
            if node scripts/check-live-news-release.mjs --json-out .cache/live-news-release-result.json; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "Exact News bytes not visible yet (attempt $attempt/5); retrying in 10s."
              sleep 10
            fi
          done
          exit 1

      - name: Finalize durable News release verification
        if: contains(steps.content-refs.outputs.paths, 'news/index.html')
        env:
          # Reuse the exact-byte origin contract from the preceding gate. The
          # canonical edge may intentionally challenge GitHub datacenter IPs;
          # that documented 403 is an edge verdict, not stale content.
          NEWS_RELEASE_CONTENT_ORIGIN: https://vaultsparkstudios-website.pages.dev
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/build-content-release-receipt.mjs --finalize \
            --verification-result .cache/live-news-release-result.json \
            --output /tmp/pages-dist/api/content-deploy-receipt.json \
            --history-output /tmp/pages-dist/data/content-deploy-history.ndjson \
            --continuity-output /tmp/pages-dist/api/content-release-continuity.json
          npx wrangler@4 pages deploy /tmp/pages-dist --project-name vaultsparkstudios-website --branch main --commit-dirty=true
          node scripts/check-live-news-release.mjs
