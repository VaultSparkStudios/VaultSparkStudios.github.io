name: The Desk — Scheduled Publish

# S319 desk-cadence. THE GAP THIS CLOSES.
#
# The Desk had a complete publishing pipeline and no scheduler. `news:publish`
# existed in package.json and was referenced by ZERO workflows; the only CI news
# step was `generate-news-pages.mjs --apply` inside rum-pull.yml, which re-renders
# EXISTING articles and cannot create an edition. So cadence was whatever a
# founder session happened to run: four editions across eleven days, the last one
# six days stale, while api/news-desk-freshness.json honestly downgraded the
# public copy to "Periodic". The honest label shipped in S318; the publisher was
# never wired. This is the publisher.
#
# THE SAFETY MODEL. Authoring uses the free self-hosted `hetzner.inference`
# capability, which is documented "advisory/bulk work only, never a decision
# surface". That is honoured literally: the model authors VOICE (headline, hook,
# tldr, stance prose, transcript, meme line) and never FACT. It cannot add a
# source, invent a persona, or move a prediction date — applyProposal() only
# writes judgment fields — and runStandards() mechanically blocks any figure that
# appears in no cited fact. The GATES decide what publishes.
#
# FAIL-CLOSED, NEVER FAIL-PARKED. A rejected or unauthorable edition is dropped
# for that slot and retried at the next one. Nothing is ever held awaiting a
# human, and nothing half-authored is ever published.

on:
  schedule:
    # The four editions declared in scripts/lib/news-desk.mjs EDITIONS, offset a
    # few minutes off the hour to dodge top-of-hour runner contention.
    - cron: "7 6 * * *"   # The Wire      06:00 UTC
    - cron: "7 12 * * *"  # Midday Desk   12:00 UTC
    - cron: "7 18 * * *"  # The Close     18:00 UTC
    - cron: "7 22 * * *"  # Late Night    22:00 UTC
  workflow_dispatch:
    inputs:
      edition:
        description: "Edition to publish (wire | midday | close | latenight). Blank = infer from the current hour."
        required: false
        default: ""

concurrency:
  # Two editions writing data/news-desk/days/ at once would race the day artifact.
  group: news-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # REQUIRED, not cosmetic. build-candidate-artifact-manifest.mjs resolves
          # its generatedAt with `git show -s --format=%cI <sha>`, which fails for
          # any non-tip commit at the default depth of 1 — the shallow-clone class
          # that published a false `diverged` in S316.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install project dependencies
        # Match the established image/refresh workflows: the root lockfile is
        # intentionally untracked, so npm ci is not available here.
        run: npm install --no-audit --no-fund

      - name: Resolve edition slot
        id: slot
        run: |
          requested="${{ github.event.inputs.edition }}"
          if [ -n "$requested" ]; then
            edition="$requested"
          else
            hour=$(date -u +%H)
            case "$hour" in
              0[0-9]|10|11) edition="wire" ;;
              1[2-7])       edition="midday" ;;
              1[8-9]|2[0-1]) edition="close" ;;
              *)            edition="latenight" ;;
            esac
          fi
          echo "edition=$edition" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          echo "Publishing slot: $edition ($(date -u +%F))"

      - name: Refresh the trend radar
        id: radar
        # An empty queue is a normal outcome; a radar CRASH is not - and until
        # S337 this step could not tell them apart. `--scan || echo "…"` made
        # both a green step, and the failure then resurfaced one step later as
        # the misleading "no topic queue", so the real cause had to be recovered
        # by reading the log rather than the run status.
        #
        # The scan now writes its own verdict (queued / empty-queue /
        # sources-unreachable) plus items/topics/queued/rejected to
        # GITHUB_OUTPUT, so downstream steps and a human reading the run see the
        # cause stated rather than inferred. The step still does not fail the
        # workflow on a thin slot - an unattended publisher painted red by an
        # upstream blip is the failure this repo's resilience gate exists to
        # prevent - but a non-zero exit is now surfaced as an explicit warning
        # and carried in `steps.radar.outputs.status`.
        run: |
          set +e
          node scripts/news-trend-radar.mjs --scan
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            echo "::warning title=Trend radar scan failed::exit $status — this is a RADAR FAILURE, not an empty queue"
          fi

      - name: Report the trend radar verdict
        run: |
          echo "radar verdict : ${{ steps.radar.outputs.verdict || 'unreported' }}"
          echo "exit status   : ${{ steps.radar.outputs.status }}"
          echo "items         : ${{ steps.radar.outputs.items }}"
          echo "topics        : ${{ steps.radar.outputs.topics }}"
          echo "queued        : ${{ steps.radar.outputs.queued }}"
          echo "rejected      : ${{ steps.radar.outputs.rejected }}"

      - name: Prepare the edition skeleton
        id: prepare
        # Tolerant by contract: --prepare fetches source articles over the
        # network, so an upstream 5xx or a thin body means "no draftable topic
        # this slot", never a failed workflow. Painting an unattended cron red
        # for an upstream blip is the exact failure this repo's publisher
        # resilience gate exists to prevent.
        continue-on-error: true
        run: |
          set +e
          node scripts/news-draft-edition.mjs --prepare --edition "${{ steps.slot.outputs.edition }}" --date "${{ steps.slot.outputs.date }}"
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            echo "No draftable topic for this slot — nothing to publish."
          fi

      - name: Author the judgment fields
        id: author
        if: steps.prepare.outputs.status == '0'
        # Inference is a no-SLA experiment that may vanish without notice; an
        # unavailable service is a skipped edition, never a red cron.
        continue-on-error: true
        env:
          HETZNER_INFERENCE_API_KEY: ${{ secrets.HETZNER_INFERENCE_API_KEY }}
          HETZNER_INFERENCE_BASE_URL: ${{ secrets.HETZNER_INFERENCE_BASE_URL }}
        run: |
          set +e
          node scripts/author-news-edition.mjs --date "${{ steps.slot.outputs.date }}" --attempts 3
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          # Exit 3 = nothing authored (service unavailable, or every attempt was
          # rejected by the standards desk). Both mean "no edition this slot".
          if [ "$status" -ne 0 ]; then
            echo "::warning::No publishable edition authored for the ${{ steps.slot.outputs.edition }} slot — retrying at the next scheduled slot."
          fi

      - name: Render and inspect article-bound editorial art
        id: art
        if: steps.author.outputs.status == '0'
        continue-on-error: true
        run: |
          set +e
          node scripts/generate-news-art.mjs --date "${{ steps.slot.outputs.date }}"
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            echo "::warning::Article art generation or pixel inspection failed — edition remains a draft."
          fi

      - name: Promote the completed draft into the day artifact
        id: promote
        if: steps.art.outputs.status == '0'
        # Tolerant for the same reason: a refusal here is the editorial gate
        # doing its job, which is a dropped slot rather than an incident.
        continue-on-error: true
        run: |
          set +e
          node scripts/news-draft-edition.mjs --promote --date "${{ steps.slot.outputs.date }}"
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          # --promote refuses a day that fails validateDay() or carries an
          # unresolved standards block. That refusal is the gate working.
          if [ "$status" -ne 0 ]; then
            echo "::warning::Editorial gates refused the ${{ steps.slot.outputs.edition }} edition — dropped for this slot."
          fi

      - name: Rebuild the Desk and render pages
        if: steps.promote.outputs.status == '0'
        run: |
          node scripts/build-news-desk.mjs --rebuild
          # Normal publication may add a new story's untracked art family, but
          # it must never rewrite/delete reviewed historical pixels. Existing
          # art changes require an explicit local --refresh-art + CANON-053
          # review transaction, never an unattended scheduled run.
          changed_art="$(git diff --name-only --diff-filter=MD -- assets/og/news/)"
          if [ -n "$changed_art" ]; then
            echo "::error::Routine Desk rebuild mutated reviewed artwork:"
            echo "$changed_art"
            exit 1
          fi
          node scripts/build-news-desk-stats.mjs
          node scripts/build-news-freshness.mjs
          # Pages consume these feeds at render time. Build them first so a new
          # story cannot ship without its read-time and reader-view row.
          node scripts/build-news-desk-engagement.mjs
          node scripts/build-news-desk-reactions.mjs
          node scripts/build-shell-assets.mjs
          node scripts/generate-news-pages.mjs --apply

      - name: Desk gates — the decision surface
        if: steps.promote.outputs.status == '0'
        run: |
          # Every one of these must pass. No `|| true`: a gate that cannot fail
          # the run is not a gate, and this is the only thing standing between an
          # unattended model and a public editorial surface.
          node scripts/check-news-ai-disclosure.mjs
          node scripts/check-news-claim-parity.mjs
          node scripts/check-news-stats-coherence.mjs
          node scripts/check-news-engagement-coherence.mjs
          node scripts/build-news-desk.mjs --check
          node scripts/generate-news-pages.mjs --check
          node scripts/build-news-freshness.mjs --check

      - name: Cascade the derived public feeds
        if: steps.promote.outputs.status == '0'
        # A [skip ci] publisher must resync every byte-checked derived artifact in
        # the SAME commit, or the next --check gate goes red against a feed this
        # run stranded (the S291 cascade class).
        run: |
          # Reactions derive from the committed Desk corpus this run just changed.
          # Rebuilt WITHOUT --probe: the scheduled rum-pull owns the network probe,
          # and a publisher must not depend on an upstream read to stay coherent.
          # Safe without the R2 raw cache: deriveFeed() reads the committed
          # history ndjson, so an absent cache appends no snapshot and preserves
          # every previously measured value. Only genuinely new slugs appear as
          # unavailable, which is what a just-published story actually is.
          # The homepage Desk block renders these feeds; re-render it in the same
          # commit or the homepage advertises a stale edition.
          node scripts/build-home-desk-module.mjs
          node scripts/build-news-visual-receipts.mjs
          node scripts/build-candidate-artifact-manifest.mjs
          node scripts/build-deploy-currency.mjs
          node scripts/build-release-proof.mjs
          node scripts/build-newsroom-run.mjs
          node scripts/build-status-proof.mjs
          node scripts/build-citation.mjs
          # S324 cascade-resync: this cron commits api/news-desk-stats.json,
          # api/status-proof.json and api/news-desk.json — sources of the CANON-054
          # public stats surface and the CANON-048 intent map. Re-derive both here
          # so a news publish never strands them stale on prod.
          node scripts/build-intent-map.mjs
          node scripts/build-stats-surface.mjs
          node scripts/build-intent-map.mjs --check
          node scripts/build-stats-surface.mjs --check

      - name: Enforce published cadence
        if: always()
        # A dropped slot is acceptable only while the public feed still meets
        # its daily promise. This postcondition prevents a no-op publisher from
        # reporting green for nine days as it did before S325.
        run: node scripts/build-news-freshness.mjs --check --require-daily

      - name: Commit and publish
        if: steps.promote.outputs.status == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Keep the required publication transaction atomic. An optional RUM
          # history file is staged separately: putting a missing path in this
          # command makes git add reject EVERY path while `|| true` paints the
          # edition as "Nothing new to publish."
          git add index.html data/news-desk/ assets/og/news/ api/news-desk.json api/news-desk-feed.json api/news-desk-claims.ndjson api/news-desk-stats.json api/news-desk-freshness.json api/news-desk-reactions.json api/news-desk-engagement.json api/news-visual-receipts.json api/newsroom-run.json api/candidate-artifact-manifest.json api/deploy-currency.json api/release-proof.json api/status-proof.json api/citation.json api/intent-map.json data/stats-surface.json stats.json api/ecosystem-stats.json news/ sitemap.xml assets/shell-manifest.json sw.js
          if [ -e data/news-desk-engagement-history.ndjson ]; then
            git add data/news-desk-engagement-history.ndjson
          fi
          if git diff --cached --quiet; then
            echo "Nothing new to publish for the ${{ steps.slot.outputs.edition }} slot"
          else
            git commit -m "feat(desk): publish the ${{ steps.slot.outputs.edition }} edition [skip ci]"
            # S341 — this loop was the ONE of twelve publishers that could already
            # survive a conflict (-X theirs to keep the gated publication
            # transaction, rebase --abort to unwedge before retrying). Its shape is
            # now the shared implementation every publisher calls, plus the
            # re-validation it lacked: -X theirs settles a collision but says
            # nothing about a dependent that merely hashes an input the rebase moved.
            bash scripts/ci/publish-push.sh "Desk edition (${{ steps.slot.outputs.edition }})" --resync --attempts 3
          fi

      - name: Slot summary
        if: always()
        run: |
          echo "### The Desk — ${{ steps.slot.outputs.edition }} slot" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- prepare: \`${{ steps.prepare.outputs.status || 'skipped' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- author:  \`${{ steps.author.outputs.status || 'skipped' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- art:     \`${{ steps.art.outputs.status || 'skipped' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- promote: \`${{ steps.promote.outputs.status || 'skipped' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "A non-zero status is a dropped slot, not an incident — the next scheduled edition retries." >> "$GITHUB_STEP_SUMMARY"
