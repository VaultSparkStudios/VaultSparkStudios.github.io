name: Draft Monthly Signal Log Revival

on:
  schedule:
    - cron: "41 13 1 * *"
  workflow_dispatch:

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Prove draft-only contract
        run: node scripts/draft-journal-revival.mjs --self-test
      - name: Generate review-only draft
        env:
          HETZNER_INFERENCE_API_KEY: ${{ secrets.HETZNER_INFERENCE_API_KEY }}
          HETZNER_INFERENCE_BASE_URL: ${{ secrets.HETZNER_INFERENCE_BASE_URL }}
        run: node scripts/draft-journal-revival.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signal-log-draft
          path: journal/_drafts/revival-*.md
          if-no-files-found: ignore
          retention-days: 30
