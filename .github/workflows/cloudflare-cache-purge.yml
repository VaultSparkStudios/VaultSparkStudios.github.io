name: Cloudflare Cache Purge

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Purge production only for a confirmed ready promotion"
        required: true
        default: false
        type: boolean
  push:
    branches: [main]

jobs:
  purge-cache:
    name: Purge Cloudflare Cache
    runs-on: ubuntu-latest
    # Requires CF_API_TOKEN and CF_ZONE_ID secrets set in repo Settings.
    # CF_API_TOKEN needs Zone / Cache Purge permission.
    # CF_ZONE_ID is the zone ID for vaultsparkstudios.com (found in Cloudflare dashboard).
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Evaluate production promotion gate
        id: promotion-gate
        run: node scripts/check-production-promotion-gate.mjs --emit-github-output
        env:
          PRODUCTION_CONFIRM: ${{ inputs.confirm_production }}

      - name: Install release-ceremony browser dependencies
        if: steps.promotion-gate.outputs.allowed == 'true'
        # S319: this step's NAME promised browsers; it installed only npm packages,
        # so the ceremony it feeds failed in seconds with nothing to launch and the
        # result read as a failing quality gate rather than a missing dependency.
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium firefox webkit

      - name: Run canonical release ceremony
        if: steps.promotion-gate.outputs.allowed == 'true'
        run: >-
          node scripts/run-release-ceremony.mjs
          --url=https://website.staging.vaultsparkstudios.com
          --ci --require-ready

      - name: Promotion held — cache remains untouched
        if: steps.promotion-gate.outputs.allowed != 'true'
        run: echo "Production promotion is held; cache purge skipped."

      - name: Purge Cloudflare cache
        if: steps.promotion-gate.outputs.allowed == 'true'
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "Cloudflare purge response: $response"
          if [ "$response" != "200" ]; then
            echo "Warning: CF cache purge returned HTTP $response — check CF_API_TOKEN and CF_ZONE_ID secrets"
            exit 0
          fi
          echo "Cache purged successfully"
