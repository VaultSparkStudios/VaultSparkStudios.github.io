name: RUM Field Pull

# S174 rum-autopull-ci — accrue field RUM history daily so the strict perf
# ladder (scripts/check-rum-strict-ladder.mjs) flips on evidence cadence,
# not founder-session cadence. Pipeline is dependency-free (node builtins).
# Commits with [skip ci] so the push does not trigger the full suite.
on:
  schedule:
    - cron: "17 6 * * *" # daily 06:17 UTC (offset to dodge top-of-hour load)
  workflow_dispatch:

jobs:
  rum-pull:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Pull RUM from R2 and roll up
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          node scripts/fetch-rum-from-r2.mjs
          node scripts/rollup-rum.mjs
          node scripts/pull-rum-summary.mjs
          # The R2 raw corpus exists only in this job's workspace. Build the
          # country aggregate here before that cache disappears; the uptime
          # workflow cannot recover real-visitor geography from its own cache.
          node scripts/build-geo-vitals.mjs
          # Per-article engagement is privacy-thresholded before it leaves the
          # ignored raw cache. Live presence remains ephemeral in KV.
          node scripts/build-news-desk-engagement.mjs
          # S317: reader-signal rollup. --probe reads the public per-slug GET for a
          # bounded corpus-derived slug list (never KV.list) and appends history.
          node scripts/build-news-desk-reactions.mjs --probe
          node scripts/generate-news-pages.mjs --apply
          node scripts/build-news-visual-receipts.mjs
          node scripts/build-shell-assets.mjs
          # RUM history is also a labelled last-known-healthy contribution to
          # the Worker incident onset interval. Close the public evidence
          # cascade in the same commit so [skip ci] cannot strand trust feeds.
          node scripts/build-worker-route-history.mjs
          node scripts/build-public-status.mjs
          node scripts/build-candidate-artifact-manifest.mjs
          node scripts/build-release-proof.mjs
          node scripts/build-status-proof.mjs
          node scripts/build-citation.mjs
          # S324 cascade-resync: this cron commits api/status-proof.json and
          # api/public-status.json, both sources of the CANON-054 public stats
          # surface. Committing a source without re-deriving its consumer strands
          # the consumer stale on the live site.
          node scripts/build-intent-map.mjs
          node scripts/build-stats-surface.mjs
          node scripts/build-intent-map.mjs --check
          node scripts/build-stats-surface.mjs --check

      - name: Grade field verdicts (S174 field-verdict-engine)
        run: node scripts/compare-rum-windows.mjs --grade-receipts || echo "verdict engine not present or no boundary — skipping"

      - name: Regression alerting (S175)
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node scripts/send-regression-alert.mjs || echo "alerting skipped"

      - name: Commit accrued field history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rum-history.ndjson data/rum-summary.json data/field-verdicts.json data/worker-route-history.ndjson data/news-desk-engagement-history.ndjson data/news-desk-reactions-history.ndjson api/geo-vitals.json api/news-desk-engagement.json api/news-desk-reactions.json api/news-visual-receipts.json api/worker-route-history.json api/public-status.json api/candidate-artifact-manifest.json api/release-proof.json api/status-proof.json api/citation.json api/intent-map.json data/stats-surface.json stats.json api/ecosystem-stats.json news/ assets/desk-presence.shell-*.js assets/desk-reactions.shell-*.js assets/shell-manifest.json sw.js 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new field samples today"
          else
            git commit -m "chore: accrue RUM field history [skip ci]"
            git pull --rebase --autostash origin main
            git push
          fi
