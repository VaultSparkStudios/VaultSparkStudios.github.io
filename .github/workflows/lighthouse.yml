name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    # S231: the trend-ledger commit step pushes back to main. Without this the default
    # GITHUB_TOKEN is read-only on push events → `git push` returned 403 (exit 128),
    # reding the whole Lighthouse gate even though every audit passed.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Cloudflare's WAF returns managed-challenge HTML to GitHub Actions runner
      # IPs, so pointing Lighthouse at https://vaultsparkstudios.com/ audits the
      # challenge page (not the site) and wait-on times out. Running Lighthouse
      # against a local preview server built from the same repo artifacts
      # audits the real shipped HTML/CSS/JS without the WAF in the way.
      - name: Start local preview server
        run: |
          node scripts/local-preview-server.mjs &
          echo "PREVIEW_PID=$!" >> $GITHUB_ENV
        env:
          LOCAL_PREVIEW_HOST: 127.0.0.1
          LOCAL_PREVIEW_PORT: '4173'

      - name: Wait for local preview
        run: npx --yes wait-on --timeout 30000 --interval 500 http://127.0.0.1:4173/

      # S231: warm the preview server before auditing so the first (cold) request's
      # inflated LCP doesn't drag the homepage median. Mirrors the lighthouse-staging
      # warmup (S229). Non-fatal — purely a measurement-quality step.
      # S233: 3 warmup passes instead of 1. First pass primes Node.js HTTP + fs cache;
      # second primes the connection keep-alive pool; third ensures static assets (AVIF
      # hero cover) are file-cached. Eliminates the 4.5s FCP→LCP gap caused by cold
      # disk reads on the first Lighthouse iteration of a 6-file AVIF/WebP hero tile.
      - name: Warm up local preview
        run: |
          for pass in 1 2 3; do
            for u in / /games/ /community/ /leaderboards/ /journal/ /contact/ /stats/ /stats/ecosystem/ /news/2026-08-11/cloudflare-gave-the-agent-a-browser-and-a-chaperone/; do
              curl -s -o /dev/null "http://127.0.0.1:4173$u" || true
            done
          done

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://127.0.0.1:4173/
            http://127.0.0.1:4173/games/
            http://127.0.0.1:4173/community/
            http://127.0.0.1:4173/leaderboards/
            http://127.0.0.1:4173/journal/
            http://127.0.0.1:4173/contact/
            http://127.0.0.1:4173/stats/
            http://127.0.0.1:4173/stats/ecosystem/
            http://127.0.0.1:4173/news/2026-08-11/cloudflare-gave-the-agent-a-browser-and-a-chaperone/
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Collect Lighthouse JSON results
        run: >-
          mkdir -p lighthouse-results &&
          find .lighthouseci -name 'lhr-*.json' -exec cp {} lighthouse-results/ \; 2>/dev/null || true

      - name: Check Lighthouse trend
        # S227: regression gate — exits 1 if any page+category regressed ≥0.05 vs committed trend ledger.
        # Silently skips when no prior history exists (seeds automatically on first run).
        run: node scripts/check-lighthouse-trend.mjs --check

      - name: Check Lighthouse route tiers
        # S270: route-aware release bar. LHCI enforces the global minimum; this keeps
        # first-impression/trust routes strict and long-tail/generated routes explicit.
        run: node scripts/check-lighthouse-route-tiers.mjs

      - name: Update Lighthouse trend ledger
        # S229: commit updated .cache/lighthouse-trend.json so the trend history grows
        # each run. Only commits when the ledger actually changed to avoid [skip ci] spam.
        # S231: push only on push-to-main (fork PRs get a read-only token), rebase first to
        # survive the hourly Action race, and treat the whole step as non-fatal bookkeeping —
        # the gate is the prior "Check Lighthouse trend" step; a ledger-push hiccup must never
        # red a green audit.
        if: success() && github.event_name == 'push'
        continue-on-error: true
        run: |
          node scripts/check-lighthouse-trend.mjs --update
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .cache/lighthouse-trend.json
          if git diff --cached --quiet; then
            echo "No trend change to commit."
            exit 0
          fi
          git commit -m "chore: update lighthouse trend ledger [skip ci]"
          bash scripts/ci/publish-push.sh "lighthouse trend" --attempts 2 || echo "trend push skipped (non-fatal)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stop local preview
        if: always()
        run: |
          if [ -n "${PREVIEW_PID:-}" ]; then kill "$PREVIEW_PID" || true; fi

  # S286 — dual-surface release gate. Staging is Hetzner-hosted (not Cloudflare-fronted),
  # so it catches network-path, header, and runtime regressions local preview cannot see.
  # This job is blocking: a failed staging audit must make the workflow fail.
  lighthouse-staging:
    runs-on: ubuntu-latest
    needs: lighthouse
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Wait for staging reachability
        run: npx --yes wait-on --timeout 120000 --interval 5000 https://website.staging.vaultsparkstudios.com/

      - name: Warm up staging server
        run: >-
          curl -s -o /dev/null -w "warmup: %{http_code} in %{time_total}s\n"
          https://website.staging.vaultsparkstudios.com/ &&
          curl -s -o /dev/null -w "warmup games: %{http_code} in %{time_total}s\n"
          https://website.staging.vaultsparkstudios.com/games/ || true

      - name: Run Lighthouse against staging
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            https://website.staging.vaultsparkstudios.com/
            https://website.staging.vaultsparkstudios.com/games/
            https://website.staging.vaultsparkstudios.com/membership/
            https://website.staging.vaultsparkstudios.com/community/
            https://website.staging.vaultsparkstudios.com/stats/
            https://website.staging.vaultsparkstudios.com/stats/ecosystem/
            https://website.staging.vaultsparkstudios.com/news/2026-08-11/cloudflare-gave-the-agent-a-browser-and-a-chaperone/
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
