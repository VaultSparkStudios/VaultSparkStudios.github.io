name: Public REST Contract Canary

on:
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-rest-contract-canary
  cancel-in-progress: false

jobs:
  live-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      # Read-only anonymous limit=0 probes. Never rewrite/bless the manifest in CI.
      - name: Probe every shipped public REST query
        run: node scripts/check-public-rest-contract.mjs --live
