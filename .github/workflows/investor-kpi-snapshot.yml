name: Investor KPI Snapshot (daily)

# Captures one row/day into public.investor_kpi_snapshots so the investor
# portal can render historical sparklines (30-day rolling window read via
# get_investor_kpi_series RPC). The capture itself is a single SQL call
# to the write_investor_kpi_snapshot() function defined in
# supabase-s136-investor-portal-depth.sql.
#
# Idempotent — the function uses ON CONFLICT (snapshot_date) DO UPDATE so
# re-runs on the same UTC day refresh the row in place rather than dup.

on:
  schedule:
    - cron: '5 7 * * *'  # 07:05 UTC daily — after most overnight activity has settled
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Capture today's KPI snapshot
        env:
          SBP_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF:      fjnpzjjyhnpmunfoycrp
        run: |
          if [ -z "$SBP_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN repo secret missing — add it (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          RESP=$(curl -s -w "\nHTTP:%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SBP_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"query":"select public.write_investor_kpi_snapshot();"}')
          STATUS=$(echo "$RESP" | tail -1 | sed 's/HTTP://')
          BODY=$(echo "$RESP" | head -n -1)
          echo "Status: $STATUS"
          echo "Body:   $BODY"
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "201" ]; then
            echo "::error::Snapshot capture failed."
            exit 1
          fi
          echo "✓ KPI snapshot captured for $(date -u +%Y-%m-%d)"
