name: Refresh Live Data

on:
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch:

concurrency:
  group: refresh-live-data
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Sample canonical external destinations
        run: node scripts/probe-canonical-destinations.mjs

      - name: Refresh the declared live-data dependency closure
        run: node scripts/run-derived-builds.mjs --profile refresh-live-data

      - name: Commit refreshed feeds and their rendered consumers
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html changelog/index.html news/ api/ data/ stats.json feed/ journal/dispatches/feed.xml .well-known/llms-full.txt llms-full.txt 2>/dev/null || true
          git add 'projects/*/llms-full.txt' .cache/cta-readiness.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Live data unchanged — nothing to deploy."
          else
            git commit -m "chore: refresh live data feeds [skip ci]"
            bash scripts/ci/publish-push.sh "live data feeds"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy fresh data to Cloudflare Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages-deploy.yml --ref main
