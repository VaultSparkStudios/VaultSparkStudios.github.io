name: CI Status Beacon

# Write api/ci-status.json after key workflows complete on main.
# Uses [skip ci] commit so the push does not re-trigger the full suite.
on:
  workflow_run:
    workflows:
      - "E2E Test Suite"
      - "Accessibility Audit"
      - "Lighthouse CI"
    types: [completed]
    branches: [main]

concurrency:
  group: ci-status-beacon-main
  cancel-in-progress: false

jobs:
  beacon:
    runs-on: ubuntu-latest
    # Only act on push-triggered runs, not PRs or manual dispatches
    if: github.event.workflow_run.event == 'push'
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Fetch recent workflow run statuses
        id: status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          node - <<'JS'
          const { execSync } = require('child_process');
          const fs = require('fs');
          const path = require('path');

          const WATCHED = ['E2E Test Suite', 'Accessibility Audit', 'Lighthouse CI'];
          const FAILED = new Set(['failure', 'timed_out', 'startup_failure', 'action_required']);
          const repo = process.env.REPO;

          // Discover which workflows have a schedule: trigger
          function getScheduledWorkflowNames() {
            const wfDir = path.join(process.cwd(), '.github', 'workflows');
            if (!fs.existsSync(wfDir)) return [];
            return fs.readdirSync(wfDir)
              .filter(f => f.endsWith('.yml') || f.endsWith('.yaml'))
              .filter(f => /^\s*schedule:/m.test(fs.readFileSync(path.join(wfDir, f), 'utf8')))
              .map(f => {
                const src = fs.readFileSync(path.join(wfDir, f), 'utf8');
                const m = src.match(/^name:\s*(.+?)\s*$/m);
                return m ? m[1].replace(/^["']|["']$/g, '') : f.replace(/\.ya?ml$/, '');
              });
          }

          const SCHEDULED_NAMES = new Set(getScheduledWorkflowNames());

          // Fetch enough runs to cover infrequently-running scheduled workflows
          const runs = JSON.parse(
            execSync(`gh api /repos/${repo}/actions/runs?per_page=60&branch=main`, { encoding: 'utf8' })
          ).workflow_runs || [];

          // Push-triggered gate status (push:check suite — E2E/A11y/Lighthouse)
          const latest = {};
          for (const run of runs) {
            const name = run.name;
            if (!WATCHED.includes(name)) continue;
            if (latest[name]) continue;
            latest[name] = { name, status: run.conclusion || run.status, updatedAt: run.updated_at };
          }

          // Scheduled workflow last-conclusion tracking (closes S224 staleness-beacon gap)
          const scheduledByName = {};
          for (const run of runs) {
            if (run.event !== 'schedule') continue;
            const name = run.name;
            if (!SCHEDULED_NAMES.has(name)) continue;
            if (!scheduledByName[name]) scheduledByName[name] = [];
            scheduledByName[name].push({ conclusion: run.conclusion, status: run.status, updatedAt: run.updated_at });
          }

          const scheduledWorkflows = Array.from(SCHEDULED_NAMES).map(name => {
            const history = scheduledByName[name] || [];
            const completed = history.filter(r => r.conclusion);
            let streak = 0;
            for (const r of completed) {
              if (FAILED.has(r.conclusion)) streak++;
              else break;
            }
            return {
              name,
              lastConclusion: completed[0] ? completed[0].conclusion : 'unknown',
              lastUpdatedAt: history[0] ? history[0].updatedAt : null,
              recentConclusions: completed.slice(0, 3).map(r => r.conclusion),
              dead: streak >= 2,
              streak,
            };
          });

          const workflows = WATCHED.map(n => latest[n] || { name: n, status: 'unknown', updatedAt: null });
          const allGreen = workflows.every(w => w.status === 'success');
          const hasFailure = workflows.some(w => w.status === 'failure');
          const hasDeadCron = scheduledWorkflows.some(w => w.dead);

          const payload = {
            generatedAt: new Date().toISOString(),
            generatedBy: '.github/workflows/ci-status-beacon.yml',
            allGreen,
            hasDeadCron,
            summary: allGreen && !hasDeadCron
              ? 'All CI gates passing — E2E, Accessibility, Lighthouse. No dead crons.'
              : hasFailure
                ? 'One or more CI gates are failing. Studio is investigating.'
                : hasDeadCron
                  ? 'Push gates green. One or more scheduled workflows are dead.'
                  : 'CI gates in progress or status unknown.',
            workflows,
            scheduledWorkflows,
          };

          fs.mkdirSync('api', { recursive: true });
          fs.writeFileSync('api/ci-status.json', JSON.stringify(payload, null, 2) + '\n');
          const tag = allGreen ? 'ALL GREEN' : 'NOT ALL GREEN';
          const cronTag = hasDeadCron ? ' | DEAD CRONS' : '';
          console.log('Wrote api/ci-status.json: ' + tag + cronTag);
          JS

      - name: Commit updated CI status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add api/ci-status.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update CI status beacon [skip ci]"
            git pull --rebase --autostash origin main
            git push
          fi
