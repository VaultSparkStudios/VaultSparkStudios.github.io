name: CI Status Beacon

# Write api/ci-status.json after key workflows complete on main.
# Uses [skip ci] commit so the push does not re-trigger the full suite.
on:
  workflow_run:
    workflows:
      - "E2E Test Suite"
      - "Accessibility Audit"
      - "Lighthouse CI"
    types: [completed]
    branches: [main]

concurrency:
  group: ci-status-beacon-main
  cancel-in-progress: false

jobs:
  beacon:
    runs-on: ubuntu-latest
    # Only act on push-triggered runs, not PRs or manual dispatches
    if: github.event.workflow_run.event == 'push'
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Fetch recent workflow run statuses
        id: status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: node scripts/build-ci-status-beacon.mjs

      - name: Commit updated CI status
        run: |
          node scripts/build-status-proof.mjs
          node scripts/build-citation.mjs
          node scripts/build-status-proof.mjs --check --check-content
          node scripts/build-citation.mjs --check
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add api/ci-status.json api/status-proof.json api/citation.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update CI status beacon [skip ci]"
            git pull --rebase --autostash origin main
            git push
          fi
