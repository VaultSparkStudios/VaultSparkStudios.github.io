name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - 'config/csp-policy.mjs' # Worker imports WORKER_CSP from here — edits must redeploy
      - 'scripts/smoke-live.mjs'
      - '.github/workflows/cloudflare-worker-deploy.yml'

# Avoid overlapping deploys racing the same Worker route.
concurrency:
  group: worker-deploy-production
  cancel-in-progress: false

jobs:
  deploy-worker:
    name: Deploy Security Headers Worker
    runs-on: ubuntu-latest
    # Requires CF_WORKER_API_TOKEN secret (Cloudflare API token with
    # Workers Scripts: Edit + Zone: Read + R2 Bucket Read/Edit permissions).
    # R2 scope is mandatory because cloudflare/wrangler.toml binds RUM_BUCKET
    # to vaultspark-rum; Wrangler validates that binding during deploy.
    # CF_WORKER_API_TOKEN is separate from CF_API_TOKEN (cache purge only).
    # Set in: GitHub repo → Settings → Secrets and variables → Actions.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # wrangler v4 requires Node >= 22

      # package-lock.json is gitignored in this repo, so `npm ci` / npm cache are
      # unavailable. `npm install` resolves wrangler from package.json devDeps.
      - name: Install deps (pins wrangler via package.json)
        run: npm install --no-audit --no-fund

      # Single source of truth: `npm run deploy` == the same command developers
      # run locally (`wrangler deploy --env production --config cloudflare/...`).
      # Never inline a bare `wrangler deploy` here — without --env production it
      # pushes a routeless Worker that silently never updates the live route.
      - name: Deploy Worker (npm run deploy)
        id: deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKER_API_TOKEN }}

      # A green deploy is NOT proof the site is up. This gate fetches real nav
      # routes through the live edge and fails the job (RED → GitHub notifies)
      # if the Worker hangs / self-loops / serves nothing — the exact failure
      # that took the apex down on 2026-06-08 while the deploy reported success.
      - name: Post-deploy liveness gate
        run: node scripts/smoke-live.mjs --base=https://vaultsparkstudios.com

      # Self-healing: if the deploy SUCCEEDED but the liveness gate failed, the bad
      # Worker is already live on the route. Auto-revert to the previous (last-known-
      # good) version instead of leaving prod broken until a human pushes a fix — the
      # exact MTTR gap behind the 2026-06-08 outage. Only fires when the deploy step
      # itself succeeded (a failed deploy changed nothing to roll back).
      - name: Auto-rollback on failed liveness
        if: failure() && steps.deploy.outcome == 'success'
        run: >-
          npx wrangler rollback --env production --config cloudflare/wrangler.toml --yes
          --message "auto-rollback - liveness gate failed (run ${{ github.run_id }})"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKER_API_TOKEN }}

      - name: Verify rollback restored the site
        if: failure() && steps.deploy.outcome == 'success'
        run: node scripts/smoke-live.mjs --base=https://vaultsparkstudios.com
