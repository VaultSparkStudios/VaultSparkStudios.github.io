name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Promote the current ready Worker candidate to production"
        required: true
        default: false
        type: boolean
      installation_deployment_id:
        description: "Exact isolated-staging installation metadata ID (optional paired reference)"
        required: false
        default: ""
        type: string
      installation_payload_sha256:
        description: "SHA-256 of the paired installation metadata payload"
        required: false
        default: ""
        type: string
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - 'config/csp-policy.mjs' # Worker imports WORKER_CSP from here — edits must redeploy
      - 'scripts/smoke-live.mjs'
      - '.github/workflows/cloudflare-worker-deploy.yml'

# Avoid overlapping deploys racing the same Worker route.
concurrency:
  group: worker-deploy-production
  cancel-in-progress: false

jobs:
  deploy-worker:
    name: Deploy Security Headers Worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    # Requires CF_WORKER_API_TOKEN secret (Cloudflare API token with
    # Workers Scripts: Edit + Zone: Read + R2 Bucket Read/Edit permissions).
    # R2 scope is mandatory because cloudflare/wrangler.toml binds RUM_BUCKET
    # to vaultspark-rum; Wrangler validates that binding during deploy.
    # CF_WORKER_API_TOKEN is separate from CF_API_TOKEN (cache purge only).
    # Set in: GitHub repo → Settings → Secrets and variables → Actions.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # wrangler v4 requires Node >= 22

      - name: Validate isolated staging inputs
        id: isolated-inputs
        run: node scripts/validate-isolated-staging-workflow-inputs.mjs --emit-github-output >> "$GITHUB_OUTPUT"
        env:
          PRODUCTION_CONFIRM: ${{ inputs.confirm_production }}
          INSTALLATION_DEPLOYMENT_ID: ${{ inputs.installation_deployment_id }}
          INSTALLATION_PAYLOAD_SHA256: ${{ inputs.installation_payload_sha256 }}

      - name: Evaluate production promotion gate
        id: promotion-gate
        run: node scripts/check-production-promotion-gate.mjs --emit-github-output
        env:
          PRODUCTION_CONFIRM: ${{ inputs.confirm_production }}

      - name: Promotion held — no production mutation
        if: steps.promotion-gate.outputs.allowed != 'true'
        run: echo "Production promotion is held; source-control update only."

      # package-lock.json is gitignored in this repo, so `npm ci` / npm cache are
      # unavailable. `npm install` resolves wrangler from package.json devDeps.
      - name: Install deps (pins wrangler via package.json)
        if: steps.promotion-gate.outputs.allowed == 'true'
        # S319: the ceremony this step feeds runs a BROWSER suite. Installing only
        # npm packages made it fail in ~4 seconds with no browser to launch, which
        # read as a failing quality gate rather than a missing dependency — the
        # same defect pages-deploy.yml carried.
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium firefox webkit

      - name: Receive run-bound isolated staging observation
        id: isolated-staging
        if: steps.promotion-gate.outputs.allowed == 'true' && steps.isolated-inputs.outputs.configured == 'true'
        run: node scripts/run-isolated-staging-rendezvous.mjs --emit-github-output >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRODUCTION_CONFIRM: ${{ inputs.confirm_production }}
          INSTALLATION_DEPLOYMENT_ID: ${{ inputs.installation_deployment_id }}
          INSTALLATION_PAYLOAD_SHA256: ${{ inputs.installation_payload_sha256 }}

      - name: Run canonical release ceremony
        if: steps.promotion-gate.outputs.allowed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISOLATED_CONTEXT: ${{ steps.isolated-staging.outputs.context_file }}
          ISOLATED_CONTEXT_SHA256: ${{ steps.isolated-staging.outputs.context_sha256 }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "$ISOLATED_CONTEXT" ]; then
            ARGS+=("--isolated-staging-context=$ISOLATED_CONTEXT" "--isolated-staging-context-sha256=$ISOLATED_CONTEXT_SHA256")
            node scripts/check-staging-parity.mjs --require-green "${ARGS[@]}"
            node scripts/build-release-proof.mjs "${ARGS[@]}"
          fi
          node scripts/run-release-ceremony.mjs --url=https://website.staging.vaultsparkstudios.com --ci --require-ready "${ARGS[@]}"

      - name: Revalidate isolated staging immediately before promotion
        if: steps.promotion-gate.outputs.allowed == 'true' && steps.isolated-staging.outputs.configured == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISOLATED_CONTEXT: ${{ steps.isolated-staging.outputs.context_file }}
          ISOLATED_CONTEXT_SHA256: ${{ steps.isolated-staging.outputs.context_sha256 }}
        run: node scripts/check-staging-deploy-receipt.mjs --remote "--isolated-staging-context=$ISOLATED_CONTEXT" "--isolated-staging-context-sha256=$ISOLATED_CONTEXT_SHA256"

      # Single source of truth: `npm run deploy` == the same command developers
      # run locally (`wrangler deploy --env production --config cloudflare/...`).
      # Never inline a bare `wrangler deploy` here — without --env production it
      # pushes a routeless Worker that silently never updates the live route.
      - name: Deploy Worker (npm run deploy)
        if: steps.promotion-gate.outputs.allowed == 'true'
        id: deploy
        run: npm run deploy -- --confirm-production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKER_API_TOKEN }}
          # Belt-and-braces: wrangler.toml already pins account_id, but passing
          # it explicitly means the deploy does not depend on that staying true.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # A green deploy is NOT proof the site is up. This gate fetches real nav
      # routes through the live edge and fails the job (RED → GitHub notifies)
      # if the Worker hangs / self-loops / serves nothing — the exact failure
      # that took the apex down on 2026-06-08 while the deploy reported success.
      - name: Post-deploy liveness gate
        if: steps.promotion-gate.outputs.allowed == 'true'
        run: node scripts/smoke-live.mjs --base=https://vaultsparkstudios.com

      # Self-healing: if the deploy SUCCEEDED but the liveness gate failed, the bad
      # Worker is already live on the route. Auto-revert to the previous (last-known-
      # good) version instead of leaving prod broken until a human pushes a fix — the
      # exact MTTR gap behind the 2026-06-08 outage. Only fires when the deploy step
      # itself succeeded (a failed deploy changed nothing to roll back).
      - name: Auto-rollback on failed liveness
        if: failure() && steps.promotion-gate.outputs.allowed == 'true' && steps.deploy.outcome == 'success'
        run: >-
          npx wrangler rollback --env production --config cloudflare/wrangler.toml --yes
          --message "auto-rollback - liveness gate failed (run ${{ github.run_id }})"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKER_API_TOKEN }}

      - name: Verify rollback restored the site
        if: failure() && steps.promotion-gate.outputs.allowed == 'true' && steps.deploy.outcome == 'success'
        run: node scripts/smoke-live.mjs --base=https://vaultsparkstudios.com
