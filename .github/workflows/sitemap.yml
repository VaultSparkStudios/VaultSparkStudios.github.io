name: Generate Sitemap

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Generate semantic sitemap.xml
        run: node scripts/generate-sitemap.mjs

      - name: Generate feed.xml
        run: node scripts/generate-feed.mjs

      - name: Commit generated files if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml feed.xml member-sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update sitemap + feed [skip ci]"
            # S341 — this loop pushed first and rebased afterwards, with no
            # --autostash and no way out of a conflict: one content collision on
            # sitemap.xml left the runner detached mid-rebase and every remaining
            # attempt pushed from a branchless HEAD. Shared, gated implementation.
            bash scripts/ci/publish-push.sh "sitemap publish"
          else
            echo "No changes, skipping commit"
          fi
