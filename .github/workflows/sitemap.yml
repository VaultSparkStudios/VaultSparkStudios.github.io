name: Generate Sitemap

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate semantic sitemap.xml
        run: node scripts/generate-sitemap.mjs

      - name: Generate feed.xml
        run: node scripts/generate-feed.mjs

      - name: Commit generated files if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml feed.xml member-sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update sitemap + feed [skip ci]"
            for attempt in 1 2 3; do
              if git push; then
                exit 0
              fi
              echo "Push attempt $attempt rejected — rebasing on origin/main and retrying"
              git pull --rebase origin main
            done
            echo "Push failed after 3 rebase attempts"
            exit 1
          else
            echo "No changes, skipping commit"
          fi
