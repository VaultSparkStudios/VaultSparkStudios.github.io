name: Visual Regression (mobile)

# S131 audit #4 — pixel-diff snapshots of 5 mobile surfaces × 3 viewports.
# Runs on every PR that touches HTML/CSS/JS in /assets, /vault, /games, /membership,
# /vault-member, or the root. Catches regressions like S130's brand cutoff +
# dark drawer + IGNIS dot-on-scroll BEFORE the founder sees them.
#
# Baselines live under `tests/__snapshots__/visual-regression.spec.js-snapshots/`
# and must be committed alongside any intentional UI change.
#
# To re-baseline locally:
#   npx playwright test tests/visual-regression.spec.js --update-snapshots
#
# Pull requests snapshot the checked-out candidate through local preview.
# Manual comparisons can explicitly select a deployed origin.
#
# ── Baseline capture (S134/S223) ─────────────────────────────────────────────
# Local snapshots on Windows/macOS differ from Ubuntu runner pixels and are
# NOT portable. Use the `update_baselines` mode to capture Linux baselines:
#
#   gh workflow run "Visual Regression (mobile)" \
#     -f update_baselines=true
#
# Download the resulting `visual-regression-baselines` artifact and commit the
# PNG files under `tests/__snapshots__/visual-regression.spec.js-snapshots/`.
# The next PR run will then compare against committed truth.
#
# Without `update_baselines=true`, a run with no committed baselines will
# fail — that is expected and correct (no phantom-pass when truth is absent).

on:
  pull_request:
    paths:
      - 'assets/**'
      - 'index.html'
      - 'membership/**'
      - 'vault-member/**'
      - 'games/**'
      - 'vault/**'
      - 'tests/visual-regression.spec.js'
      - 'tests/__snapshots__/**'
      - '.github/workflows/visual-regression.yml'
  # Allow ad-hoc manual runs (e.g. immediately after a deploy to refresh baseline).
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Comparison origin; baseline generation always requires the checked-out candidate preview'
        required: false
        default: 'http://127.0.0.1:4173'
      update_baselines:
        description: >-
          Set to true to capture new Linux baselines (--update-snapshots) and
          upload them as an artifact for committing. Use after intentional UI changes.
        required: false
        default: 'false'
      scene_diagnostics:
        description: 'Log bounded read-only scene/native-matcher diagnostics (loopback comparison only; snapshot generation refused)'
        required: false
        type: boolean
        default: false

      failure_scene_diagnostics:
        description: 'Retain full matrix; observe only failed Games / Pixel 5 / dark (loopback comparison; no baseline generation)'
        required: false
        type: boolean
        default: false

      games_controlled_experiment:
        description: 'Diagnostic only: full-matrix ordinary / no-op / Range; known persistent target control required'
        required: false
        type: boolean
        default: false

jobs:
  snapshot:
    name: Snapshot mobile surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Record controlled experiment budget
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.games_controlled_experiment == 'true'
        run: node -e 'require("node:fs").appendFileSync(process.env.GITHUB_ENV,"VS_GAMES_EXPERIMENT_STARTED_AT="+Date.now()+"\n")'
      - uses: actions/checkout@v4
      - name: Admit diagnostic scope before browser setup
        env:
          DIAG_BEFORE: ${{ github.event.inputs.scene_diagnostics || 'false' }}
          DIAG_FAILURE: ${{ github.event.inputs.failure_scene_diagnostics || 'false' }}
          DIAG_UPDATE: ${{ github.event.inputs.update_baselines || 'false' }}
          DIAG_EXPERIMENT: ${{ github.event.inputs.games_controlled_experiment || 'false' }}
          DIAG_ORIGIN: ${{ github.event.inputs.base_url || 'http://127.0.0.1:4173' }}
        run: |
          node --input-type=module -e '
          const {DIAG_BEFORE:b,DIAG_FAILURE:f,DIAG_UPDATE:u,DIAG_ORIGIN:o,DIAG_EXPERIMENT:e="false"}=process.env;
          if (![b,f,u,e].every(v=>["true","false"].includes(v))) throw Error("Boolean diagnostic inputs required");
          if (b==="true" && f==="true") throw Error("Diagnostic flags are exclusive");
          if (e==="true" && (b==="true" || o!=="http://127.0.0.1:4173")) throw Error("Controlled experiment requires exact candidate without before diagnostics");
          if (b==="true" || f==="true" || e==="true") {
            const x=new URL(o);
            if (u!=="false" || !["http:","https:"].includes(x.protocol) || !["localhost","127.0.0.1","[::1]"].includes(x.hostname) || x.username || x.password)
              throw Error("Diagnostics require loopback comparison without generation");
          }'
      - name: Admit candidate capture source
        env:
          CAPTURE_ORIGIN: ${{ github.event.inputs.base_url || 'http://127.0.0.1:4173' }}
          CAPTURE_UPDATE: ${{ github.event.inputs.update_baselines || 'false' }}
          CAPTURE_SHA: ${{ github.sha }}
        run: node scripts/admit-visual-capture.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Lockfile is gitignored in this repo (.gitignore), so `cache: 'npm'` (which
      # needs a committed lockfile to hash) and `npm ci` both fail. Use `npm install`
      # — same pattern as accessibility.yml / cloudflare-worker-deploy.yml.
      - run: npm install --no-audit --no-fund
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Start candidate preview
        run: |
          node scripts/local-preview-server.mjs &
          echo "PREVIEW_PID=$!" >> $GITHUB_ENV
        env:
          LOCAL_PREVIEW_HOST: 127.0.0.1
          LOCAL_PREVIEW_PORT: '4173'
      - name: Wait for candidate preview
        run: timeout 30 bash -c 'until curl --fail --silent --output /dev/null http://127.0.0.1:4173/; do sleep 0.5; done'
      - name: Verify desktop header fit in every theme
        env:
          BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/navigation.spec.js --grep "Desktop header keeps every control" --project=chromium --reporter=line
      # Pin to chromium: the spec emulates device viewports/UA/scale, but the
      # rendering ENGINE must be a single reproducible one or baselines are
      # meaningless (webkit vs chromium differ pixel-for-pixel, and firefox
      # was never installed here — a latent error once the suite stopped
      # crashing at collection). The S130 bug class is layout/CSS, engine-agnostic.
      - name: Run visual-regression snapshots
        if: github.event.inputs.games_controlled_experiment != 'true'
        env:
          BASE_URL: http://127.0.0.1:4173
          VR_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.base_url || '' }}
          VS_FAILURE_SCENE_DIAGNOSTICS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.failure_scene_diagnostics == 'true' && 'true' || '' }}
          VS_SCENE_DIAGNOSTICS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.scene_diagnostics == 'true' && 'true' || '' }}
        run: >-
          npx playwright test tests/visual-regression.spec.js --project=chromium --reporter=line
          ${{ github.event.inputs.update_baselines == 'true' && '--update-snapshots=all' || '' }}
          ${{ (github.event.inputs.scene_diagnostics == 'true' || github.event.inputs.failure_scene_diagnostics == 'true') && '--update-snapshots=none' || '' }}
      - name: Run controlled Games experiment (nonacceptance)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.games_controlled_experiment == 'true'
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node scripts/run-games-controlled-experiment.mjs --run-controlled-games
      - name: Stop candidate preview
        if: always()
        run: |
          if [ -n "${PREVIEW_PID:-}" ]; then kill "$PREVIEW_PID" || true; fi
      - name: Upload new baselines (update_baselines mode)
        if: >-
          always() && github.event.inputs.update_baselines == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-baselines
          include-hidden-files: true
          path: |
            tests/__snapshots__/
            .cache/visual-capture-source.json
          retention-days: 30
      - name: Upload diff report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diffs
          include-hidden-files: true
          path: |
            test-results/
            playwright-report/
            .cache/games-controlled-experiment/
          retention-days: 14
