name = "vaultspark-security-headers"
main = "security-headers-worker.js"
compatibility_date = "2025-01-01"
account_id = "2d737158a4dde61a7a476a9fda51af2f"

[env.production]
routes = [
  { pattern = "vaultsparkstudios.com/*",     zone_name = "vaultsparkstudios.com" },
  { pattern = "hub.vaultsparkstudios.com/*", zone_name = "vaultsparkstudios.com" }
]

[env.production.vars]
PUBLIC_ORIGIN = "https://vaultsparkstudios.com"
# Edge gate for private portals — redirects unauthenticated requests to
# /investor-portal/*, /studio-hub/*, /vault-member/admin/* to the sign-in surface.
# Safe to enable: portals already require JS auth; gate simply moves the redirect to the edge.
PORTAL_GATE_ENABLED = "1"
PORTAL_GATE_COOKIE  = "vs_portal_session"

# CSP nonce injection via HTMLRewriter. Off until staging smoke test confirms no inline-script
# breakage. When flipped to "1", per-request nonce replaces the 73-hash policy with
# 'nonce-X' 'strict-dynamic' + Worker-injected <meta name="csp-nonce"> on every HTML response.
NONCE_CSP_ENABLED = "1"

# Rate-limit on POST to /contact/submit + /ask-founders/submit. KV binding active below.
RATE_LIMIT_ENABLED = "1"

# S172 tt-soak-kv-probe: the original soak (0.5% sampling, 1-day TTL) could
# never accumulate readable evidence at current traffic — the KV probe found
# zero tt:* keys while the report-only header was live. For the soak window,
# sample 100% of TT reports and hold them 30 days so probe-tt-soak.mjs can
# read a real signal. Report-only intake only — does NOT change enforcement.
# Revert both to defaults after the enforce decision lands.
TT_REPORT_SAMPLE_RATE = "1"
TT_REPORT_TTL_SEC     = "2592000"

# S335: Trusted Types ENFORCE switch. "1" moves require-trusted-types-for into the
# live Content-Security-Policy and drops the report-only header. Flip only when
# api/tt-readiness.json reports enforceEligible: true; set back to "0" to roll
# back without a code deploy. Founder-approved S335; held on the readiness receipt.
TT_ENFORCE_ENABLED = "0"

# Hub subdomain migration flag. When "1", the worker:
#   1) serves auth + proxy for hub.vaultsparkstudios.com (requires HUB_* secrets)
#   2) 301 redirects legacy /studio-hub/* to https://hub.vaultsparkstudios.com/*
# Leave at "0" until DNS + secrets are live, then flip to "1" to cut over.
HUB_SUBDOMAIN_ENABLED = "1"
HUB_SESSION_TTL_SEC   = "2592000"

# KV namespace binding for rate-limit bucket (created S86 via Global API Key).
[[env.production.kv_namespaces]]
binding = "RATE_LIMIT"
id = "6fde74ca7f3d462786afbb85c85611e0"

# S161: RUM bucket now exists. Worker /v/rum writes RUM samples to this bucket.
[[env.production.r2_buckets]]
binding = "RUM_BUCKET"
bucket_name = "vaultspark-rum"

[env.staging]
workers_dev = true
preview_urls = false
routes = [
  { pattern = "website.staging.vaultsparkstudios.com/*", zone_name = "vaultsparkstudios.com" }
]

[env.staging.vars]
# Worker-capable candidate environment. Its DNS-only origin hostname avoids a
# self-fetch loop while serving the exact atomic Hetzner working-tree release.
PRIMARY_ORIGIN = "https://website-origin.staging.vaultsparkstudios.com"
FALLBACK_ORIGIN = "https://vaultsparkstudios-website.pages.dev"
PUBLIC_ORIGIN = "https://website.staging.vaultsparkstudios.com"
PORTAL_GATE_ENABLED = "1"
PORTAL_GATE_COOKIE = "vs_portal_session_staging"
OBELISK_CLIENT_ID = "vaultsparkstudios-website"
OBELISK_REDIRECT_URI = "https://website.staging.vaultsparkstudios.com/auth/callback"
OBELISK_FLOW_COOKIE = "vs_obelisk_flow_staging"
NONCE_CSP_ENABLED = "1"
EDGE_CACHE_ENABLED = "0"
RATE_LIMIT_ENABLED = "1"
HUB_SUBDOMAIN_ENABLED = "0"

[[env.staging.kv_namespaces]]
binding = "RATE_LIMIT"
id = "a723f2358dc940a495bf0b36bbece25b"
