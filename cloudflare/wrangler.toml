name = "vaultspark-security-headers"
main = "security-headers-worker.js"
compatibility_date = "2025-01-01"
account_id = "2d737158a4dde61a7a476a9fda51af2f"

[env.production]
routes = [
  { pattern = "vaultsparkstudios.com/*",     zone_name = "vaultsparkstudios.com" },
  { pattern = "hub.vaultsparkstudios.com/*", zone_name = "vaultsparkstudios.com" }
]

[env.production.vars]
PUBLIC_ORIGIN = "https://vaultsparkstudios.com"
# Edge gate for private portals — redirects unauthenticated requests to
# /investor-portal/*, /studio-hub/*, /vault-member/admin/* to the sign-in surface.
# Safe to enable: portals already require JS auth; gate simply moves the redirect to the edge.
PORTAL_GATE_ENABLED = "1"
PORTAL_GATE_COOKIE  = "vs_portal_session"

# CSP nonce injection via HTMLRewriter. Off until staging smoke test confirms no inline-script
# breakage. When flipped to "1", per-request nonce replaces the 73-hash policy with
# 'nonce-X' 'strict-dynamic' + Worker-injected <meta name="csp-nonce"> on every HTML response.
NONCE_CSP_ENABLED = "1"

# Rate-limit on POST to /contact/submit + /ask-founders/submit. KV binding active below.
RATE_LIMIT_ENABLED = "1"

# S172 tt-soak-kv-probe: the original soak (0.5% sampling, 1-day TTL) could
# never accumulate readable evidence at current traffic — the KV probe found
# zero tt:* keys while the report-only header was live. For the soak window,
# sample 100% of TT reports and hold them 30 days so probe-tt-soak.mjs can
# read a real signal. Report-only intake only — does NOT change enforcement.
# Revert both to defaults after the enforce decision lands.
TT_REPORT_SAMPLE_RATE = "1"
TT_REPORT_TTL_SEC     = "2592000"

# S335: Trusted Types ENFORCE switch. "1" moves require-trusted-types-for into the
# live Content-Security-Policy and drops the report-only header. Flip only when
# api/tt-readiness.json reports enforceEligible: true; set back to "0" to roll
# back without a code deploy. Founder-approved S335; held on the readiness receipt.
TT_ENFORCE_ENABLED = "0"

# S349: uptime sampling from inside the edge. The GitHub Actions probe cannot see
# our edge at all — Cloudflare challenges every datacenter client, so all three
# apex legs 403 from CI and /status/ published a false `edge-degraded` for 604
# consecutive samples. A Cloudflare cron is never challenged, so it is the only
# vantage that can actually measure edge liveness.
#
# Ships DARK at "0": the scheduled() handler returns immediately, so deploying it
# changes nothing. Flip to "1" as its own release once the KV namespace below is
# created and bound; rollback is a flag flip, not a redeploy. The handler samples
# the Pages origin only — never a URL on our own routes — so it cannot self-loop.
UPTIME_SAMPLER_ENABLED = "0"

# S351 ENABLING RELEASE — the four steps above are now applied.
# The namespace was created this session via the Cloudflare bindings API after the
# gateway deploy token was confirmed to lack KV scope (error 10000); that token still
# cannot create namespaces, so do not expect `wrangler kv namespace create` to work
# with it. Rollback is a flag flip back to "0" — the binding and cron can stay.
#
# S351 STATUS: the namespace exists and the binding below is LIVE in production, but
# the 30-minute cron could NOT be registered (Workers Free caps the account at 5 cron
# triggers and all five belong to other projects — see the block further down). With
# no cron there is no invoker, so scheduled() never runs and the flag stays "0".
# Nothing has ever observed our own edge, and /status/ correctly still says so.
# Once a slot is freed: flip the flag, uncomment the cron, deploy, then confirm with
#   node scripts/drain-uptime-kv.mjs --dry-run
# The binding is declared beside the other production KV namespaces below, and the
# cron at the end of this file. Neither may sit HERE: a table header between
# [env.production.vars] and the bare keys that follow it re-parents
# HUB_SUBDOMAIN_ENABLED and HUB_SESSION_TTL_SEC out of the vars table and silently
# turns the hub subdomain off. That was caught by a wrangler dry-run, not by reading
# the edit — dry-run both envs after any table move in this file.


# Hub subdomain migration flag. When "1", the worker:
#   1) serves auth + proxy for hub.vaultsparkstudios.com (requires HUB_* secrets)
#   2) 301 redirects legacy /studio-hub/* to https://hub.vaultsparkstudios.com/*
# Leave at "0" until DNS + secrets are live, then flip to "1" to cut over.
HUB_SUBDOMAIN_ENABLED = "1"
HUB_SESSION_TTL_SEC   = "2592000"

# KV namespace binding for rate-limit bucket (created S86 via Global API Key).
[[env.production.kv_namespaces]]
binding = "RATE_LIMIT"
id = "6fde74ca7f3d462786afbb85c85611e0"

# S351: uptime sampler bucket. One key per 30-minute window, 7-day TTL.
[[env.production.kv_namespaces]]
binding = "UPTIME_SAMPLES"
id = "adfe5ed60c90426ea1286321360138e3"

# S161: RUM bucket now exists. Worker /v/rum writes RUM samples to this bucket.
[[env.production.r2_buckets]]
binding = "RUM_BUCKET"
bucket_name = "vaultspark-rum"

[env.staging]
workers_dev = true
preview_urls = false
routes = [
  { pattern = "website.staging.vaultsparkstudios.com/*", zone_name = "vaultsparkstudios.com" }
]

[env.staging.vars]
# Worker-capable candidate environment. Its DNS-only origin hostname avoids a
# self-fetch loop while serving the exact atomic Hetzner working-tree release.
PRIMARY_ORIGIN = "https://website-origin.staging.vaultsparkstudios.com"
FALLBACK_ORIGIN = "https://vaultsparkstudios-website.pages.dev"
PUBLIC_ORIGIN = "https://website.staging.vaultsparkstudios.com"
PORTAL_GATE_ENABLED = "1"
PORTAL_GATE_COOKIE = "vs_portal_session_staging"
OBELISK_CLIENT_ID = "vaultsparkstudios-website"
OBELISK_REDIRECT_URI = "https://website.staging.vaultsparkstudios.com/auth/callback"
OBELISK_FLOW_COOKIE = "vs_obelisk_flow_staging"
NONCE_CSP_ENABLED = "1"
EDGE_CACHE_ENABLED = "0"
RATE_LIMIT_ENABLED = "1"
HUB_SUBDOMAIN_ENABLED = "0"

[[env.staging.kv_namespaces]]
binding = "RATE_LIMIT"
id = "a723f2358dc940a495bf0b36bbece25b"

# S351: this WOULD drive scheduled() every 30 minutes. A Cloudflare cron is never
# bot-challenged, so it is the only vantage that can actually observe our own edge.
# Scoped to env.production deliberately rather than left as a top-level inheritable
# key: staging must never sample production, and inheritance is an assumption rather
# than a stated fact about this deploy.
# S351 BLOCKED — the cron is declared below but COMMENTED OUT, and the flag above is
# back to "0". Deploying it returned Cloudflare error 10072:
#
#   This account has reached the Workers Free limit of 5 cron triggers per account.
#
# All five slots belong to OTHER projects (seamline */5, studio-ops-cron */30,
# veilos hourly, velaxis-proxy x2). The Worker itself deployed fine and the
# UPTIME_SAMPLES binding is LIVE — only the schedule was refused. Wrangler does not
# roll back the successful part, so a Worker carrying a cron it cannot register
# fails EVERY subsequent deploy at the trigger step. That is why this is commented
# out rather than left declared and permanently red.
#
# To enable, a founder decides ONE of:
#   (a) free a cron slot by retiring one of the five above — a live change to a
#       different project, so it is not this repo to make; or
#   (b) move the account to Workers Paid, raising the limit to 1,000.
# Then uncomment the two lines below and flip the flag above back to "1".
#
# [env.production.triggers]
# crons = ["*/30 * * * *"]
