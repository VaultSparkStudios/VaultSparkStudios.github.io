<!doctype html><html class="dark-mode" data-theme="dark"><head><meta charset="utf-8"><title>Signing you in…</title></head><body style="margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0f17;color:#e6edf3;font-family:system-ui" class="dark-mode" data-theme="dark">
<div>Completing sign-in…</div>
<script>(async function(){
  var params=new URLSearchParams(location.search);
  var token=params.get('obelisk_session');
  if(!token){location.replace('/login?error=auth');return;}
  // Static sites must verify via a serverless function/Worker that calls
  // https://obeliskgate.com/auth/verify-session (the secret stays at the IdP). Replace the
  // endpoint below with your deployed verifier.
  try{
    var r=await fetch('/api/obelisk-verify',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:token})});
    var d=await r.json();
    if(d&&d.ok&&d.identityId){
      var session={
        provider:'obelisk',
        identityId:d.identityId,
        expiresAt:d.expiresAt||null,
        capabilities:Array.isArray(d.capabilities)?d.capabilities:[],
        verifiedAt:new Date().toISOString()
      };
      sessionStorage.setItem('vs_obelisk_session',JSON.stringify(session));
      sessionStorage.setItem('obelisk_identity',d.identityId);
      location.replace(params.get('return_to')||'/');
    }
    else location.replace('/login?error=auth');
  }catch(e){location.replace('/login?error=auth');}
})();</script></body></html>
