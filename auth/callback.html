  <title>Completing Obelisk sign-in — VaultSpark Studios</title>

<body style="margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0f17;color:#e6edf3;font-family:system-ui;" class="dark-mode" data-theme="dark">
  <p>Returning to the VaultSpark identity edge…</p>
  <script>
    // Production terminates this route in the Cloudflare Worker. A Pages-origin
    // fallback forwards only the OIDC query to the canonical edge; it never
    // parses, stores, or verifies identity in browser JavaScript.
    if (location.hostname !== 'vaultsparkstudios.com') {
      location.replace('https://vaultsparkstudios.com/auth/callback' + location.search);
    } else {
      location.replace('/login?auth_error=edge_unavailable');
    }
  </script>

</body>
