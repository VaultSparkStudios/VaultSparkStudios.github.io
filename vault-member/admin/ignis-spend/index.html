<style>
    .spend-shell { max-width: 920px; margin: 2rem auto 4rem; padding: 0 1.25rem; color: var(--text); }
    .spend-shell h1 { font-family: Georgia, serif; font-size: clamp(1.6rem, 2.4vw, 2.1rem); letter-spacing: 0.04em; margin-bottom: 0.4rem; }
    .spend-shell p.lede { color: var(--text-muted, #aab); margin-top: 0; margin-bottom: 1.6rem; }
    .spend-card { background: rgba(13,16,28,0.7); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 1.1rem 1.2rem; margin-bottom: 1rem; }
    .spend-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0.85rem; }
    .spend-stat { background: rgba(255,255,255,0.03); border-radius: 10px; padding: 0.85rem 0.9rem; }
    .spend-stat__label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted, #889); }
    .spend-stat__value { font-family: Georgia, serif; font-size: 1.5rem; margin-top: 0.2rem; color: var(--gold, #d4af37); }
    .spend-stat__value--ok    { color: #6fd996; }
    .spend-stat__value--warn  { color: #f5b94c; }
    .spend-stat__value--capped { color: #ff7a7a; }
    table.spend-table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
    table.spend-table th, table.spend-table td { padding: 0.55rem 0.6rem; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.06); }
    table.spend-table th { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted, #889); }
    .spend-bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.06); overflow: hidden; margin-top: 0.25rem; }
    .spend-bar__fill { height: 100%; background: linear-gradient(90deg, #6fd996, #f5b94c, #ff7a7a); transition: width 200ms ease; }
    .spend-status { display: inline-block; padding: 0.18rem 0.55rem; border-radius: 999px; font-size: 0.72rem; font-family: Georgia, serif; letter-spacing: 0.06em; }
    .spend-status--ok    { background: rgba(111,217,150,0.12); color: #6fd996; }
    .spend-status--warn  { background: rgba(245,185,76,0.12); color: #f5b94c; }
    .spend-status--capped { background: rgba(255,122,122,0.12); color: #ff7a7a; }
    .spend-status--disabled { background: rgba(255,255,255,0.06); color: #889; }
    .spend-empty { padding: 1.5rem; text-align: center; color: var(--text-muted, #889); }
    .spend-actions { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-top: 1rem; }
    .spend-btn { background: rgba(212,175,55,0.1); border: 1px solid rgba(212,175,55,0.3); color: var(--gold, #d4af37); padding: 0.55rem 1rem; border-radius: 8px; font-size: 0.85rem; cursor: pointer; min-height: 44px; }
    .spend-btn:hover { background: rgba(212,175,55,0.18); }
    .spend-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .spend-alert-row { font-size: 0.85rem; padding: 0.5rem 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .spend-alert-row time { color: var(--text-muted, #889); font-size: 0.78rem; }
  </style>
</head>
<body class="dark-mode" data-theme="dark">
  <main class="spend-shell" data-vault-member-required="admin">
    <h1>IGNIS Spend</h1>
    <p class="lede">Daily token consumption across every IGNIS edge function. Hard caps enforced server-side; this is the read-only operator view.</p>

    <section class="spend-card" aria-labelledby="spend-summary-heading">
      <h2 id="spend-summary-heading" style="margin:0 0 0.85rem;font-size:0.92rem;font-family:Georgia,serif;letter-spacing:0.06em;text-transform:uppercase;color:var(--gold,#d4af37);">Today</h2>
      <div class="spend-summary" id="spend-summary">
        <div class="spend-stat"><div class="spend-stat__label">Total spend</div><div class="spend-stat__value" data-stat="usd_today">—</div></div>
        <div class="spend-stat"><div class="spend-stat__label">Daily cap</div><div class="spend-stat__value" data-stat="cap_usd">—</div></div>
        <div class="spend-stat"><div class="spend-stat__label">% of cap</div><div class="spend-stat__value" data-stat="pct">—</div></div>
        <div class="spend-stat"><div class="spend-stat__label">Status</div><div class="spend-stat__value" data-stat="status">—</div></div>
      </div>
      <div class="spend-actions">
        <button class="spend-btn" id="refresh-btn" type="button">↻ Refresh</button>
        <a class="spend-btn" href="/vault-member/" style="text-decoration:none;display:inline-flex;align-items:center;">← Vault portal</a>
      </div>
    </section>

    <section class="spend-card" aria-labelledby="spend-table-heading">
      <h2 id="spend-table-heading" style="margin:0 0 0.85rem;font-size:0.92rem;font-family:Georgia,serif;letter-spacing:0.06em;text-transform:uppercase;color:var(--gold,#d4af37);">Per-function breakdown</h2>
      <table class="spend-table">
        <thead><tr><th>Function</th><th>Today</th><th>Cap</th><th>Calls</th><th>%</th><th>Status</th></tr></thead>
        <tbody id="spend-rows"><tr><td colspan="6" class="spend-empty">Loading…</td></tr></tbody>
      </table>
    </section>

    <section class="spend-card" aria-labelledby="spend-alerts-heading">
      <h2 id="spend-alerts-heading" style="margin:0 0 0.85rem;font-size:0.92rem;font-family:Georgia,serif;letter-spacing:0.06em;text-transform:uppercase;color:var(--gold,#d4af37);">Recent alerts</h2>
      <div id="spend-alerts"><p class="spend-empty">Loading…</p></div>
    </section>
  </main>
