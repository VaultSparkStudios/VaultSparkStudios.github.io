project_id = "vaultsparkstudios.github.io"

[auth]
site_url = "https://vaultsparkstudios.com/"
additional_redirect_urls = [
  "https://vaultsparkstudios.com/vault-member/",
  "https://vaultsparkstudios.com/vault-member/#reset",
  "https://www.vaultsparkstudios.com/",
  "https://www.vaultsparkstudios.com/vault-member/",
  "http://localhost:5173/",
  "http://localhost:5174/",
  "https://vorn-web-sigma.vercel.app/reset-password",
  "https://vorn.dev/reset-password",
  "https://vorn-web-sigma.vercel.app/auth/callback",
  "https://mindframe-web.vercel.app/",
  "https://mindframe.vercel.app/**",
  "https://usemindframe.com/**",
  "https://joinvorn.com/auth/callback",
  "https://joinvorn.com/**"
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = true
enable_manual_linking = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"

[auth.rate_limit]
email_sent = 5
sms_sent = 30
anonymous_users = 30
token_refresh = 150
sign_in_sign_ups = 10
token_verifications = 10
web3 = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

# Captcha intentionally disabled.
# [auth.captcha]
# enabled = false

# [auth.sessions] requires Supabase Pro plan
# timebox = "720h"
# inactivity_timeout = "168h"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
otp_length = 6
max_frequency = "5s"

# Edge-function JWT posture (pinned S183 — prevents a plain redeploy from
# silently flipping verify_jwt and breaking in-code-authenticated endpoints).
# Values mirror the live Management-API state read on 2026-06-10.
# These two authenticate in-code (Stripe signature / guest checkout), so the
# gateway must NOT pre-reject calls that carry no Supabase JWT.
[functions.create-checkout]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

# These require a valid Supabase member JWT at the gateway.
[functions.assign-discord-role]
verify_jwt = true

[functions.odds]
verify_jwt = true

# S275: pin the remaining functions so config.toml is the single, complete
# source of truth for gateway posture. Values verified against LIVE behavior
# on 2026-07-12 via unauthenticated probes (gateway UNAUTHORIZED_NO_AUTH_HEADER
# = verify_jwt true; a function-body response = the function ran, so false).

# Gateway requires a JWT (anon-key JWT suffices for public callers via
# supabase-js; getUser() does member/tier resolution in-code).
[functions.ask-ignis]
verify_jwt = true

[functions.create-gift-checkout]
verify_jwt = true

[functions.customer-portal-session]
verify_jwt = true

[functions.send-push]
verify_jwt = true

[functions.upload-investor-doc]
verify_jwt = true

# Authenticate in-code — gateway must NOT pre-reject bare requests.
# eternal-intelligence: optional-JWT tiering (anonymous = free tier).
[functions.eternal-intelligence]
verify_jwt = false

# semantic-search: public search surface with in-code input validation.
[functions.semantic-search]
verify_jwt = false

# send-investor-digest: GitHub Action caller with DIGEST_SECRET Bearer check in-code.
[functions.send-investor-digest]
verify_jwt = false

# send-member-newsletter: secret-Bearer in-code check (probe returned gateway
# NOT_FOUND on 2026-07-12 — not currently deployed; posture pinned for when it is).
[functions.send-member-newsletter]
verify_jwt = false
